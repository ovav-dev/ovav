    visible_by_default: false
    agents:
      architecture_cartographer:
        responsibilities: [map_system, contracts, dependencies]
      harness_engineer:
        responsibilities: [harnesses, gates, validators]
      opencode_integrator:
        responsibilities: [agents, skills, commands, adapters]
      security_auditor:
        responsibilities: [permissions, secrets, risk]
      install_engineer:
        responsibilities: [backup, rollback, install]
      release_operator:
