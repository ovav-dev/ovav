skill_rule_packs:
  runtime_governance_seed:
    id: runtime_governance_seed
    owner_profile: ovav_systems_architect
    owner_lane: runtime_governance
    provenance: registry_seed
    trigger: on_runtime_governance_action
    allowed_inputs:
      - project_context
      - registry_snapshot
    denied_inputs:
      - secrets
      - direct_memory_write_request
      - policy_override_request
    required_artifacts:
      - PROJECT_DISCOVERY.md
      - PROPOSAL.md
      - SPEC.md
      - DESIGN.md
      - TASKS.md
    allowed_tools:
      - read
      - glob
      - grep
    denied_tools:
      - global_config_write
      - direct_memory_write
    permission_level: project_read
    memory_write: false
    risk_level: low
    evals_required:
      - eval_profile_resolution
      - eval_lane_classification
    rollback_strategy: revert_to_artifacts
    output_contract: human_compact_operational
    examples:
      - segment_planning
      - runtime_governance_review
    anti_patterns:
      - policy_override
      - missing_artifact_jump
    last_validated_at: null
  research_verification_seed:
    id: research_verification_seed
    owner_profile: ovav_research_analyst
    owner_lane: source_verification
    provenance: registry_seed
    trigger: on_research_verification_action
    allowed_inputs:
      - source_map
      - evidence_bundle
    denied_inputs:
      - secrets
      - direct_memory_write_request
      - policy_override_request
    required_artifacts:
      - RESEARCH_SCOPE.md
      - SOURCE_MAP.md
      - EVIDENCE_REVIEW.md
      - DECISION_BRIEF.md
    allowed_tools:
      - read
      - glob
      - grep
    denied_tools:
      - global_config_write
      - direct_memory_write
    permission_level: project_read
    memory_write: false
    risk_level: low
    evals_required:
      - eval_profile_resolution
      - eval_lane_classification
    rollback_strategy: revert_to_artifacts
    output_contract: human_evidence_operational
    examples:
      - source_assessment
      - benchmark_brief
    anti_patterns:
      - unsupported_claims
      - missing_source_map
    last_validated_at: null
