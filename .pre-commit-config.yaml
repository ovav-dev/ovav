# OVAV Pre-Commit Configuration — 2026 Stack
# Framework: pre-commit 4.6.0
# Tools: ruff 0.15.16, gitleaks 8.30.1, mypy 2.1.0
#
# All hooks are BLOCKING. If any fail, commit is rejected.
# Run manually: .venv/bin/pre-commit run --all-files

# ── OVAV: artifact/evidence directories excluded from auto-formatting ──
# These contain historical records, sealed files, and session evidence.
# They must NEVER be auto-modified by formatters.
_exclude_artifacts: &exclude_artifacts
  exclude: |
    (?x)^(
      \.ovav/artifacts/|
      \.ovav/memory/|
      \.ovav/governor/|
      \.ovav/gate_self_hash
    )

repos:
  # ── Secrets Detection (CRITICAL — blocks commit if secrets found) ──
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
        stages: ["pre-commit"]

  # ── Python Linting + Auto-Formatting ──
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.16
    hooks:
      - id: ruff
        args: ["--fix", "--show-fixes"]
        stages: ["pre-commit"]
      - id: ruff-format
        stages: ["pre-commit"]

  # ── Type Checking ──
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.1.0
    hooks:
      - id: mypy
        args: ["--strict", "--ignore-missing-imports"]
        files: ^tools/security/|^tools/validators/|^tools/harnesses/
        stages: ["pre-commit"]
        additional_dependencies: [types-pyyaml]

  # ── Dependency Security ──
  - repo: local
    hooks:
      - id: pip-audit
        name: pip-audit
        entry: .venv/bin/pip-audit
        language: system
        pass_filenames: false
        stages: ["pre-push"]

  # ── General Checks ──
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-yaml
        args: ["--unsafe"]
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=500"]
      - id: detect-private-key
        exclude: ^tools/permissions/rego_engine\.py$
      - id: no-commit-to-branch
        args: ["--branch", "main", "--branch", "master"]
      - id: trailing-whitespace
        <<: *exclude_artifacts
      - id: end-of-file-fixer
        <<: *exclude_artifacts
