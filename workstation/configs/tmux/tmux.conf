# OVAV tmux baseline — keyboard and clipboard stability.
# Source of truth: workstation/configs/tmux/tmux.conf
# Mouse is off so the host terminal can select/copy text from full-screen TUIs.
# Prefix + m toggles tmux mouse controls when pane interaction is needed.

set-option -s extended-keys on
set-option -s extended-keys-format csi-u
set-option -as terminal-features ",xterm*:extkeys"
set-option -g set-clipboard external
set-option -g mouse off
set-option -g renumber-windows on

# Direct host navigation: Alt+1/2/3 are stable named workspace routes.
# Names are intentional; numeric targets drift when a window is closed.
bind-key -n M-1 select-window -t =home
bind-key -n M-2 select-window -t =ovav
bind-key -n M-3 select-window -t =akrynt

# Prefix + m toggles tmux mouse controls when pane interaction is needed.
bind-key m set-option -g mouse \; display-message "tmux mouse: #{?mouse,on,off}"
