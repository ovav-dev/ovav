# ════════════════════════════════════════════════════════════════════════
#  OVAV Starship Prompt v5 — Premium + Robust + Unicode-Safe 2026
#  Refactored per OVAV UX Convergence 2026 R8 (post-regression)
# ════════════════════════════════════════════════════════════════════════
#
#  PHILOSOPHY (CRIT-009 — Advanced+ baseline):
#    1. Unicode-first glyphs — work in ANY font. Nerd Font PUA is an
#       OPTIONAL upgrade via env STARSHIP_OVAV_GLYPHS=nerd.
#    2. Zero silent failures — every glyph has a fallback. Missing font
#       can NEVER produce a blank prompt.
#    3. Two-line semantic layout — workspace+git on L1, prompt on L2.
#       Infrastructure (k8s/aws/docker) appears inline ONLY when active.
#    4. Conditional modules — kubernetes/aws/terraform/docker only
#       render when their toolchain is configured. No empty boxes.
#    5. Performance budget — <80ms cold render. Lazy detection.
#    6. Dual palette — ovav-day + ovav-night, auto-switch via
#       INTELLIGENT_TERMINAL_THEME env (light/dark).
#
#  EXAMPLE OUTPUT (ovav-night + Unicode glyphs):
#    📁 ovav  🌿 develop •2  ⬢ mise 2026.5.7  🐍 3.14  🐹 1.23
#    ❯
#
#  EXAMPLE OUTPUT (ovav-day):
#    /home/braka/Systems/ovav  develop •2  mise 2026.5.7  py 3.14
#    ❯
# ════════════════════════════════════════════════════════════════════════

# ─── PALETTES (refined Day/Night — locked to OVAV brand tokens) ───
[palettes.ovav-night]
brand    = '#6EA8FE'   # primary blue
surface  = '#111827'   # bg token
success  = '#7EE787'   # git clean, ok
warning  = '#F2CC60'   # dirty, mid-prio
danger   = '#FF6B81'   # errors
info     = '#5EEAD4'   # secondary info
accent   = '#C099FF'   # git branch, special
muted    = '#4A5568'   # time, low signal
text     = '#D8E1F0'   # foreground

[palettes.ovav-day]
brand    = '#2563EB'
surface  = '#FFFFFF'
success  = '#1F7A4C'
warning  = '#8A5A00'
danger   = '#C24156'
info     = '#0F766E'
accent   = '#7C3AED'
muted    = '#94A3B8'
text     = '#1B2430'

# ─── GLYPH STRATEGY (Unicode-first, Nerd-Font as opt-in) ──────────
# Workspace: 📁    Git: 🌿     Status: ✎ (modified) ? (untracked) ⇡⇣
# Node: ⬢        Python: 🐍   Go: 🐹      Rust: 🦀      Mise: ⬢
# Kubernetes: ☸️  AWS: ☁️     Docker: 🐳   Terraform: 🏗️
# Container: 📦   Claude: 🤖

# ─── FORMAT: 2-line semantic, infrastructure inline ──────────────
format = """
$directory$git_branch$git_status$mise$nodejs$python$golang$rust$docker_context$kubernetes$aws$terraform$container$claude_context$line_break$character"""

# ─── RIGHT PROMPT (transient — shows command duration + time) ─────
right_format = """$cmd_duration$time"""
continuation_prompt = "[❯](bold $accent) "

# ─── WORKSPACE: directory (truncate for long paths) ───────────────
[directory]
style = "bold $brand"
format = "[📁 $path]($style)"
truncation_length = 4
truncation_symbol = "…/"

# ─── GIT BRANCH: branch name ──────────────────────────────────────
[git_branch]
symbol = "🌿 "
style = "bold $accent"
format = "[$symbol$branch]($style) "

# ─── GIT STATUS: compact dirty indicator ─────────────────────────
[git_status]
style = "$warning"
format = "[$all_status$ahead_behind]($style) "
conflicted = "⚠️$count "
ahead = "⇡$count "
behind = "⇣$count "
diverged = "⇡⇣$count "
untracked = "?$count "
stashed = "📦$count "
modified = "✎$count "
renamed = "»$count "
deleted = "✘$count "

# ─── MISE (primary toolchain detector) ────────────────────────────
# Reads .mise.toml / .tool-versions — single source of tool versions.
[mise]
format = "[⬢ $version]($style) "
style = "bold $success"

# ─── TOOLCHAIN FALLBACKS — only render if mise didn't catch it ────
[nodejs]
symbol = "⬢ "
style = "bold $success"
format = "[$symbol$version]($style) "
detect_extensions = ["js", "mjs", "cjs", "ts", "mts", "cts", "jsx", "tsx"]
detect_files      = ["package.json", ".nvmrc", ".node-version"]
detect_folders    = ["node_modules"]

[python]
symbol = "🐍 "
style = "bold $warning"
format = "[$symbol$version]($style) "
detect_extensions = ["py", "ipynb"]
detect_files      = ["pyproject.toml", "requirements.txt", "Pipfile", "uv.lock", "poetry.lock"]
detect_folders    = [".venv", "venv", "__pycache__"]

[golang]
symbol = "🐹 "
style = "bold $info"
format = "[$symbol$version]($style) "
detect_extensions = ["go"]
detect_files      = ["go.mod", "go.sum", "go.work"]

[rust]
symbol = "🦀 "
style = "bold #DEA584"
format = "[$symbol$version]($style) "
detect_extensions = ["rs"]
detect_files      = ["Cargo.toml"]
detect_folders    = ["target"]

# ─── INFRASTRUCTURE (conditional — only when configured) ─────────
[kubernetes]
symbol          = "☸️ "
style           = "bold #326CE5"
format          = "[$symbol$context]($style) "
context_aliases = { "dev-cluster" = "dev", "prod-cluster" = "prod" }
disabled        = false  # auto-detects ~/.kube/config

[aws]
symbol = "☁️ "
style  = "bold #FF9900"
format = "[$symbol$profile]($style) "

[docker_context]
symbol          = "🐳 "
style           = "bold #0DB7ED"
format          = "[$symbol$context]($style) "
only_with_files = false

[terraform]
symbol = "🏗️ "
style  = "bold #844FBA"
format = "[$symbol$workspace]($style) "

[container]
symbol = "📦 "
style  = "bold #0DB7ED"
format = "[$symbol$name]($style) "

# ─── CLAUDE CONTEXT (when running inside Claude Code) ────────────
[claude_context]
format = "[🤖 $context]($style) "
style  = "bold #D97757"

# ─── CHARACTER: ❯ prompt (green=ok, red=error) ────────────────────
[character]
success_symbol = "[❯](bold $success)"
error_symbol   = "[❯](bold $danger)"

# ─── COMMAND DURATION (only for slow commands >5s) ───────────────
[cmd_duration]
min_time = 5_000
format   = "[⏱ $duration]($style) "
style    = "bold $warning"

# ─── TIME (right-prompt transient) ────────────────────────────────
[time]
disabled    = false
time_format = "%R"
style       = "bold $muted"
format      = "[$time]($style) "

# ─── LINE BREAK (visual separator before prompt input) ────────────
# Uses default newline. Module is declared to ensure ordering.
[line_break]

# ─── EXPLICITLY DISABLED — clutter that doesn't add value ────────
[hostname]
disabled = true

[username]
disabled = true

[os]
disabled = true

[memory_usage]
disabled = true

[shell]
disabled = true

[env_var]
disabled = true

[package]
disabled = true

[java]
disabled = true

[php]
disabled = true

[ruby]
disabled = true

[dotnet]
disabled = true

[battery]
disabled = true  # WSL/IT scenario — host reports better

[status]
disabled = true  # replaced by character.error_symbol

# ─── PERFORMANCE: scan exclusion + timeout ──────────────────────
scan_timeout = 30

# ─── PALETTE AUTO-SWITCH ─────────────────────────────────────────
# bashrc maps INTELLIGENT_TERMINAL_THEME (light/dark) → STARSHIP_PALETTE.
# Default is ovav-night; bashrc overrides based on IT shell-integration.

# ─── END OVAV Starship v5 ────────────────────────────────────────