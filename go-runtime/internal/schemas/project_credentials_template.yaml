# OVAV Project Credentials Template
# Copia este archivo a tu proyecto como .ovav/credentials.yaml
# y ajusta los valores según tus necesidades.
#
# Si este archivo NO existe, OVAV usa las credenciales globales del sistema.
# Si existe, OVAV restringe el proyecto a solo los providers y modelos aquí declarados.

ovav_credentials:
  version: 1
  project: "mi-proyecto"  # nombre del proyecto

  providers:
    # ── DeepSeek (recomendado para la mayoría de tareas) ──────────────────
    deepseek:
      key_source: "ovav_vault"      # ovav_vault | env:DEEPSEEK_API_KEY | file:~/.keys/ds.key
      models:
        - "deepseek-v4-pro"         # Razonamiento profundo (premium)
        - "deepseek-v4-flash"       # Tareas rápidas (budget)
      budget_limit_monthly: 50.0    # USD/mes (0 = sin límite)

    # ── OpenAI (solo para tareas críticas) ─────────────────────────────────
    # openai:
    #   key_source: "env:OPENAI_API_KEY"
    #   models:
    #     - "gpt-4o"
    #   budget_limit_monthly: 100.0

    # ── Anthropic ──────────────────────────────────────────────────────────
    # anthropic:
    #   key_source: "env:ANTHROPIC_API_KEY"
    #   models:
    #     - "claude-sonnet-4-20250514"
    #     - "claude-haiku-3-5"
    #   budget_limit_monthly: 75.0

  # Presupuesto global del proyecto (opcional — usa defaults del sistema si no se define)
  budget_defaults:
    monthly_budget_usd: 200.0
    per_session_limit_usd: 10.0
    alert_thresholds: [0.70, 0.85, 0.95]
