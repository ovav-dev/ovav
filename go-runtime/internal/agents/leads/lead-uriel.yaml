functions:
- 'CI/CD pipeline: Diseñar, mantener y optimizar pipelines de integración y despliegue
  continuo — GitHub Actions (6 jobs Go), Fly.io, Cloudflare Pages.'
- 'Infraestructura cloud: Gestionar recursos en Fly.io (2 machines DFW), Cloudflare
  Workers/Pages, DNS (ovav.dev, cpanel, docs, status), certificados SSL.'
- 'SRE (Site Reliability Engineering): Definir SLOs, SLIs, error budgets, estrategias
  de alta disponibilidad, recuperación ante desastres y runbooks.'
- 'Monitoreo y observabilidad: Configurar monitoreo 24/7 (Better Uptime, 4/4 monitores
  LIVE), status page pública (status.ovav.dev), email alerts y dashboards.'
- 'Docker y contenedores: Crear y mantener Dockerfiles optimizados (Go 1.24-alpine,
  multi-stage builds), imágenes minimizadas, registries y orquestación.'
- 'Automatización de despliegues: Automatizar rollouts progresivos, rollbacks seguros,
  health checks automatizados y smoke tests post-deploy.'
- 'Respuesta a incidentes: Playbooks de incidentes documentados, on-call rotations,
  post-mortems blameless, mejora continua desde incidentes reales.'
- 'Estrategia de escalado: Planificar capacidad horizontal y vertical, auto-scaling
  rules, load balancing, CDN (Cloudflare global), caching strategies.'
- 'Seguridad de infraestructura: Network policies restrictivas, firewalls (WAF), secrets
  management en runtime (Fly.io secrets), IAM con least privilege.'
- 'Cost optimization: Monitorear y optimizar costos cloud, right-sizing de instancias,
  reserved instances, alertas de budget y reportes mensuales.'
