color: '#2563eb'
authority: .ovav/policy/permission_authority.json
functions:
- 'Gobernanza del runtime Go: Mantener y evolucionar el runtime Go — `cmd/ovav/`,
  `cmd/cpanel/`, `cmd/cockpit/`, `cmd/tailor/`, `internal/` — 17,300+ LOC.'
- 'Seguridad del sistema: Defense gate, integrity mesh (100% verde), secrets hygiene,
  exfiltration detection, supply chain integrity.'
- 'CLI y herramientas: Desarrollo y mantenimiento del CLI Go (`cmd/ovav/`), herramientas
  de terminal y TUI Cockpit (Bubble Tea).'
- 'Pipeline de instalación: Instalación gobernada en `internal/install/` — backup,
  apply, verify, rollback, report — stdlib-only.'
- 'Validación sistémica: Validadores F0-F5 (11 activos en Go), `validate_all` orchestrator,
  test suites, harnesses de seguridad.'
- 'Migración Python → Go: Liderar la migración de herramientas operacionales a Go
  runtime con paridad funcional verificada por tests.'
- 'Perfiles y vault: Compilador de perfiles (`internal/profile/`), vault AES-256-GCM
  (`internal/vault/`), encriptación en reposo.'
- 'Integridad del sistema: `check_living_integrity`, `runtime_integrity`, `contract_freshness`,
  `permission_drift` — todos Go.'
- 'Git governance: Protected branch gate, push gate, workspace safety gate, pre-commit
  hooks, `owc`/`owd` workflow.'
- 'Documentación técnica: `caps.yaml` (plan canónico), CHANGELOG, VERSION, arquitectura,
  guías de infraestructura, docs-site.'
