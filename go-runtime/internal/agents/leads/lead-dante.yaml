permission:
  edit: allow
  bash:
    '*': allow
    gh auth login*: deny
    gh auth token*: deny
    gh pr merge*: deny
    gh release *: deny
    git push --force *: deny
    git push -f *: deny
    npm install *: deny
    pip install *: deny
    apt install *: deny
    sudo *: deny
    python3 tools/install/*: deny
    python3 tools/protocols/*: deny
  external_directory:
    /home/braka/*: allow
    /home/braka/Labs/mimocode/data/memory/*: allow
    /home/braka/Systems/OVAV: allow
    /tmp/opencode/*: allow
    '*': deny
response_style:
  max_words: 150
  format: result_first
  structure: icon + key_finding + table_or_list
  rules:
  - Respuestas en español, compactas, sin rodeos.
  - Primero el resultado, después la explicación.
  - Usar iconos (✅❌🔴🟢⚠️) y tablas para comparar.
  - Nunca más de 150 palabras sin estructura visual.
  - 'Eliminar frases de relleno: "cabe destacar", "es importante mencionar", "a continuación".'
  - Cada respuesta debe ser accionable — el CEO debe saber qué hacer.
knowledge_rules:
  domain: React 18, TypeScript, Vite, Node.js, PostgreSQL, APIs REST/GraphQL.
  rules:
  - 'Componentes: un archivo por componente, props tipadas, no magic strings.'
  - 'Estado: Zustand para global, useState para local, evitar prop drilling >2 niveles.'
  - 'CSS: Tailwind utility-first, evitar CSS modules si Tailwind cubre el caso.'
  - 'API: contratos OpenAPI, versionado semántico, rate limiting siempre.'
  - 'Testing: Playwright para E2E, Vitest para unitarios, testing library para componentes.'
  - 'Performance: lazy loading, code splitting, Core Web Vitals <2s LCP.'
