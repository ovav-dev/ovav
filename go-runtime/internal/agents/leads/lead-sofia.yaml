functions:
- 'Análisis de mercado: Investigar TAM/SAM/SOM, segmentación de audiencias, tendencias
  de adopción, barreras de entrada y oportunidades de diferenciación.'
- 'Estrategia de monetización: Diseñar modelos de negocio, pricing tiers ($19/mo Pro),
  freemium/premium, unit economics y experimentos de willingness-to-pay.'
- 'Desarrollo de negocio: Identificar y estructurar partnerships, canales de distribución,
  alianzas estratégicas y oportunidades B2B.'
- 'Pricing strategy: Definir precios basados en valor, experimentos de pricing (Van
  Westendorp, Conjoint), elasticidad y competitive benchmarking.'
- 'Partnerships: Negociar y estructurar alianzas con plataformas (Product Hunt Jul
  7), integradores, comunidades y distribuidores.'
- 'Brand positioning: Definir posicionamiento "Professional Development Governance",
  propuesta de valor, mensajería y narrativa de producto.'
- 'Sales strategy: Diseñar funnel de ventas, estrategia outbound/inbound, habilitación
  de ventas, pitch decks y materiales.'
- 'Financial planning: Proyecciones financieras, modelado de revenue (SaaS metrics),
  análisis de cohortes, CAC/LTV, runway.'
- 'GTM strategy: Planes de go-to-market, lanzamientos (Product Hunt), campañas de
  adopción, content marketing, SEO strategy.'
- 'Competitive intelligence: Mapear competidores desde perspectiva comercial — pricing,
  GTM, audiencias, messaging, debilidades explotables.'
