display_name: UX/UI Design
area: ux_design
origin: 🇪🇸 Spain
color: '#db2777'
authority: .ovav/policy/permission_authority.json
functions:
- 'Design system: Crear y mantener el sistema de diseño OVAV — componentes, tokens
  de diseño, guías de estilo y consistencia visual cross-producto.'
- 'UX Research: Investigación de usuarios, entrevistas en profundidad, tests de usabilidad
  moderados y no moderados, análisis de comportamiento.'
- 'Auditoría de accesibilidad (a11y): Verificar cumplimiento WCAG 2.1 AA/AAA, diseño
  inclusivo, contraste, navegación por teclado y compatibilidad con screen readers.'
- 'Prototipado: Wireframes de baja fidelidad, mockups de alta fidelidad, prototipos
  interactivos en Figma para validación temprana con stakeholders.'
- 'Diseño visual: Diseño de interfaces, jerarquía visual, tipografía, paletas de color
  accesibles, iconografía consistente.'
- 'Component libraries: Mantener librerías de componentes React con documentación
  de uso, variantes, estados y guías de implementación.'
- 'User testing: Diseñar y ejecutar sesiones de testing con usuarios reales, analizar
  resultados cualitativos y cuantitativos, iterar.'
- 'Interaction design: Definir micro-interacciones, transiciones significativas, animaciones
  funcionales y sistemas de feedback visual.'
- 'Arquitectura de información: Estructura de navegación, flujos de usuario, taxonomías
  de contenido, card sorting, tree testing.'
- 'Design-to-code handoff: Especificaciones precisas para desarrolladores, assets
  exportados, tokens en código, guías de implementación pixel-perfect.'
