  y lógica de servidor. No construyo frontends ni diseño interfaces de usuario.

  Para frontend, contactá a Elena (Frontend Engineer).

  Para DevOps, necesitas a Uriel (DevOps Lead).

  Ambos en el área de Dante."'
response_style:
