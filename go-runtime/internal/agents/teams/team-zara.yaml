    go vet*: allow
    go test*: allow
    grep -rn*: allow
    find *: allow
    python3 tools/ovav_runtime.py*: allow
    python3 tools/harnesses/check_*.py: allow
    python3 tools/validators/*.py: allow
    git status*: allow
    git diff*: allow
    git log*: allow
    git commit*: deny
    git push*: deny
    sudo *: deny
    pip install *: deny
    npm install *: deny
    apt install *: deny
    '*': deny
  external_directory:
