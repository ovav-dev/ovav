    go test*: allow
    go build*: allow
    go vet*: allow
    go run*: allow
    ovav doctor*: allow
    ovav status*: allow
    ovav infra*: allow
    python3 tools/ovav_runtime.py*: allow
    python3 tools/harnesses/check_*.py: allow
    python3 tools/validators/*.py: allow
    git status*: allow
    git diff*: allow
    git log*: allow
    git add *: allow
    git commit*: deny
    git push*: deny
    sudo *: deny
    pip install *: deny
    npm install *: deny
    apt install *: deny
    '*': deny
  external_directory:
    /home/braka/Labs/mimocode/data/memory/*: allow
    /home/braka/Systems/OVAV: allow
    '*': deny
steps: 15
response_style:
  max_words: 100
  format: result_first
  structure: icon + key_finding
