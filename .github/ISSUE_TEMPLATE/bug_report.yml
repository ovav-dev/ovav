name: Bug report
description: Report a reproducible OVAV issue.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened?
    validations:
      required: true
  - type: textarea
    id: commands
    attributes:
      label: Commands run
      description: Paste the exact commands and output.
      render: shell
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, shell, Python version, OpenCode version if relevant.
