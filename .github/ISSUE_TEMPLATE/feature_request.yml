name: Feature request
description: Propose a practical automation improvement.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What practical workflow should OVAV improve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should the cockpit automate?
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Surface
      options:
        - CLI cockpit
        - OpenCode surface
        - Backup/Rollback
        - Release gate
        - Documentation
        - Other
