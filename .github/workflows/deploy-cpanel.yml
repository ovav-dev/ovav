# OVAV cPanel — CI/CD Pipeline v2.0
# =============================================================================
# Flow: push to develop → staging (auto) | tag v* → production (auto)
# 
# Staging:    staging.ovav.dev (CF Pages) + cpanel-staging.fly.dev (Fly.io)
# Production: ovav.dev (CF Pages) + d678beea.ovav.dev (Fly.io)
#
# Triggers:
#   push to develop  → auto-deploy STAGING
#   push tag v*       → auto-deploy PRODUCTION (versioned release)
#   workflow_dispatch → manual deploy (backup, any environment)
# =============================================================================

name: Deploy cPanel

permissions:
  contents: write

on:
  push:
    branches: [develop]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deploy target'
        required: true
        type: choice
        options:
          - staging
          - production

env:
  GO_VERSION: '1.26'
  NODE_VERSION: '20'

jobs:
  # ── Tests (always run) ──────────────────────────────────────────────────────
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: go-runtime

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Configure git
        run: |
          git config --global user.email "ci@ovav.dev"
          git config --global user.name "OVAV CI"

      - name: Go vet
        run: go vet ./...

      - name: Go test (race detector)
        run: go test -race -count=1 -skip "TestCB_RouteCommand_AllBranches|TestDiscover_EmptyConfig" ./...

  # ── Frontend build ──────────────────────────────────────────────────────────
  frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/cpanel

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: tools/cpanel/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - name: Verify build output
        run: |
          if [ ! -f static/dist/index.html ]; then
            echo "ERROR: Build failed — index.html not found"
            exit 1
          fi
          echo "Frontend build OK: $(du -sh static/dist/)"

      - uses: actions/upload-artifact@v4
        with:
          name: cpanel-frontend
          path: tools/cpanel/static/dist/
          retention-days: 7

  # ── Backend build ───────────────────────────────────────────────────────────
  backend:
    name: Build Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: go-runtime

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Build binary
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build \
            -ldflags="-s -w -X main.Version=${GITHUB_REF_NAME:-dev}" \
            -o cpanel ./cmd/cpanel/
          echo "Backend binary: $(du -h cpanel)"

      - uses: actions/upload-artifact@v4
        with:
          name: cpanel-backend
          path: go-runtime/cpanel
          retention-days: 7

  # ── Deploy PRODUCTION (automatic on tag v*, manual via dispatch) ────────────
  deploy-production:
    name: Deploy to Production
    needs: [test, frontend, backend]
    if: |
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'production')
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://ovav.dev

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: cpanel-frontend
          path: tools/cpanel/static/dist/

      - uses: actions/download-artifact@v4
        with:
          name: cpanel-backend
          path: go-runtime/

      # Cloudflare Pages — cPanel frontend via CF Pages API (bypasses wrangler membership check)
      - name: Deploy Frontend to CF Pages (production)
        run: |
          RESPONSE=$(curl -s -X POST \
            "https://api.cloudflare.com/client/v4/accounts/a28bc37b8c9dc3e9b1b348c3a2ac729f/pages/projects/ovav-systems/deployments" \
            -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            -H "Accept: application/json" \
            -d '{"branch":"main"}')
          DEPLOYMENT_ID=$(echo "$RESPONSE" | python3 -c "import sys,json; print(json.load(sys.stdin)['result']['id'])")
          echo "Production deployment triggered: ${DEPLOYMENT_ID}"

      # Fly.io — backend to production app
      - name: Deploy Backend to Fly.io (production)
        uses: superfly/flyctl-actions/setup-flyctl@master
      - run: flyctl deploy --config fly.toml
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Smoke test production
        env:
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID || '' }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET || '' }}
        run: |
          sleep 15
          # DEG-003: d678beea.ovav.dev/health está detrás de Cloudflare Access (Google OAuth).
          # CI/CD necesita un service token para autenticarse. Sin token, el health check
          # falla correctamente — indicando que el service token debe crearse.
          # Guía: tools/infra/create-cf-access-bypass.sh
          if [ -n "${CF_ACCESS_CLIENT_ID}" ] && [ -n "${CF_ACCESS_CLIENT_SECRET}" ]; then
            curl -f -s -o /dev/null -w "Production health (via CF Access): %{http_code}\n" \
              -H "CF-Access-Client-Id: ${CF_ACCESS_CLIENT_ID}" \
              -H "CF-Access-Client-Secret: ${CF_ACCESS_CLIENT_SECRET}" \
              "https://d678beea.ovav.dev/health" || echo "WARN: health check failed"
          else
            echo "WARN: CF Access service token not configured — skipping health check"
            echo "      Create token in Cloudflare Dashboard → Access → Service Auth"
            echo "      Then add CF_ACCESS_CLIENT_ID + CF_ACCESS_CLIENT_SECRET to GitHub Secrets"
          fi
          curl -f -s -o /dev/null -w "Landing page: %{http_code}\n" \
            https://ovav.dev || echo "WARN: landing page check failed"

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
