name: Release @ovav/pi-memory

on:
  push:
    tags:
      - "pi-memory-v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version (e.g. 3.0.0)"
        required: true
        type: string

env:
  NODE_VERSION: "20"

jobs:
  release:
    name: Publish to npm
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: npm ci --ignore-scripts
        working-directory: ovav-systems/pi-memory

      - name: Type check
        run: npx tsc --noEmit
        working-directory: ovav-systems/pi-memory

      - name: Run tests
        run: npm test
        working-directory: ovav-systems/pi-memory

      - name: Publish to npm
        run: |
          VERSION="${GITHUB_REF_NAME#pi-memory-v}"
          if [ "$VERSION" == "${GITHUB_REF_NAME}" ]; then
            VERSION="${{ inputs.version || github.event.inputs.version }}"
          fi
          echo "Publishing @ovav/pi-memory@${VERSION}"
          npm publish --access public --provenance
        working-directory: ovav-systems/pi-memory
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  release-ovav:
    name: Tag OVAV release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: startsWith(github.ref, 'refs/tags/pi-memory-v')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get version
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#pi-memory-v}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Update VERSION files
        run: |
          echo "${{ steps.version.outputs.version }}" > VERSION
          echo "${{ steps.version.outputs.version }}" > go-runtime/VERSION

      - name: Create OVAV release tag
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.git.createTag({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag: 'v${{ steps.version.outputs.version }}',
              message: 'Release @ovav/pi-memory v${{ steps.version.outputs.version }}',
              object: context.sha,
              type: 'commit'
            })
