name: "OVAV CI"
on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: Build
        run: cd go-runtime && go build ./cmd/ovav/
      - name: Test
        run: cd go-runtime && go test ./... -count=1 -timeout 60s
      - name: Validate
        run: ./bin/ovav validate
