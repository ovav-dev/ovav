name: Generate CHANGELOG

on:
  push:
    branches:
      - develop
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  changelog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate and commit CHANGELOG
        run: |
          chmod +x tools/release/generate_changelog.sh
          bash tools/release/generate_changelog.sh --commit
