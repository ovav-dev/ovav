    scope: language_policy
    source: "CEO + Thavren — 2026-06-02. Preserve model/synapse coherence in English; Spanish is the final user-facing output."

  - rule: "Do not saturate one model or the lead context for broad review. Delegate long reads, repository mapping and bulk comparisons to lower-cost/exploration models; keep Thavren responsible for synthesis, judgment, sensitive edits and final delivery."
