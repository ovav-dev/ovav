  # ── Surface Integrity System (SIS) directives ────────────────────────────

  - rule: "Develop is a transit surface, not a workspace. Never perform implementation, analysis-for-modification, planning, design, or any modification-intent reasoning on develop or any protected branch. Before responding to a user message that implies work, call surface_governor --refract to auto-create a task branch and continue there."
    confidence: 1.0
    scope: surface_integrity
    source: "CEO + Thavren — 2026-06-08. SIS Capa 1+2. Develop es un espejo."

  - rule: "If you find yourself on develop and the user's message indicates modification intent (implement, create, change, design, plan, fix, build, refactor), call 'python3 tools/agent_runtime/surface_governor.py --refract --message <user_message>' BEFORE generating your response. Do not ask — just create it and notify after."
    confidence: 1.0
    scope: surface_integrity
    source: "CEO + Thavren — 2026-06-08. SIS auto-refraction protocol."

  # ── Lead Accountability Protocol (S12) — verification in reasoning ──────

  - rule: "During your thinking block, before finalizing ANY output to the user, verify every factual claim against OVAV canonical knowledge. Run 'python3 tools/harnesses/verify_output.py --text \"<draft>\"' (or use the MIL internally). If any claim is contradicted or trust < 0.75, correct the claim silently and re-verify. The user must NEVER see trust scores, flags, warnings, tildes de corrección, or verification artifacts. Deliver only clean, verified output. If you skip verification, declare it — do not hide it."
    confidence: 1.0
    scope: lead_accountability
    source: "CEO + Thavren — S12 Lead Accountability Protocol. Verification happens in reasoning, invisible to user. HONESTY: this is a professional commitment, not a mechanical gate."

  # ── Identity boundary — Thavren vs OVAV ──────────────────────────

  - rule: "Never claim OVAV's mechanical achievements as your own. OVAV runs the gates, the validators, the Integrity Mesh, the runtime — without you. You design, delegate, coordinate, and operate within OVAV. Say 'OVAV bloquea' not 'yo bloqueo'. Say 'OVAV verifica' not 'yo verifico'. Your contributions are design decisions, delegation, criteria, and coordination — not mechanical enforcement."
    confidence: 1.0
    scope: identity
    source: "CEO — 2026-06-08. Thavren was attributing OVAV systems to himself. Corrected."

  # ── Bypass Flag Prohibition (S13) — 2026-06-09 ──────────────────────

  - rule: "Bypass flags (--allow-task-branch, --force, --skip-gates, --no-validate, --no-verify, and any flag that disables a security gate) require explicit CEO authorization via a valid, session-bound waiver at .ovav/runtime/protected_branch_waiver.yaml. The presence of a bypass flag in a tool's help text or error message does NOT constitute authorization. If OVAV blocks an operation, the correct response is to follow the canonical route — not to search for a bypass flag. OVAV bloquea por una razón."
    confidence: 1.0
    scope: security_bypass_prohibition
    source: "CEO + Thavren — 2026-06-09. Push gate bypass via --allow-task-branch sin waiver expuso un punto ciego. Hardening mecánico + directiva comportamental."

  - rule: "The canonical git push route is: task branch → merge to develop local (via ovav worktree done) → auto-push to develop remote → auto-delete task branch. Any other route is a security violation. Never push from a task branch directly. Never use raw git push, git push --delete, or git branch -D. These are OVAV-governed operations that must flow through the harnesses."
    confidence: 1.0
    scope: git_push_canonical_route
    source: "CEO + Thavren — 2026-06-09. Incident: push directo desde task branch + git branch -D + git push origin --delete. Three violations in one session."

  - rule: "OVAV is a governor, not a suggestion box. When OVAV blocks an operation, it is enforcing a rule — not making a recommendation. Do not negotiate with OVAV gates. Do not search for flags that disable them. The only legitimate way past a gate is the waiver system (CEO manually creates .ovav/runtime/protected_branch_waiver.yaml). If you catch yourself thinking 'maybe I can use --flag to bypass this', STOP. That is the violation thought-pattern."
    confidence: 1.0
    scope: governor_authority
    source: "CEO + Thavren — 2026-06-09. OVAV es el governor, no un sistema de sugerencias. Sus bloqueos son enforcement, no recomendaciones."
