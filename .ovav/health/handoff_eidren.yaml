# OVAV Health → Evidence Handoff Protocol
# =============================================================================
# Protocolo de handoff entre Renata (Health & Performance Science) y
# Eidren (Evidence & Decision Intelligence) para verificación de claims
# clínicos, nutricionales y de suplementación.
#
# Spec: GAP-M3 (health_audit.yaml) — Fase 1
# Versión: 1.0.0
# Creado: 2026-06-16
# Squads involucrados: Marina (Medical Researcher) ⇄ Sara (Evidence Analyst)

handoff:
  id: "renata→eidren_evidence"
  version: "1.0.0"
  from:
    area: "health_performance"
    lead: "renata"
    squad: "marina"  # Medical Researcher — prepara los queries
    contact_criteria: ["CRIT-R01 — Ciencia sobre opinión", "CRIT-R08 — Suplementación con respaldo"]
  to:
    area: "evidence_intelligence"
    lead: "eidren"
    squad: "sara"  # Evidence Analyst — ejecuta la búsqueda
  created_at: "2026-06-16T01:00:00-05:00"

# ── Pipeline de Evidencia ─────────────────────────────────────────────────

pipeline:
  name: "Health Evidence Verification Pipeline"
  description: >
    Cada claim de salud (nutricional, suplementación, ejercicio) debe ser
    verificable contra estudios clínicos. Este pipeline automatiza la
    solicitud de evidencia desde Health hacia Evidence Intelligence.

  steps:
    - step: 1
      name: "Claim Formulation"
      actor: "Renata / Rubén / León"
      description: >
        Se formula un claim específico con formato PICO:
        - Population: tipo de paciente/deportista
        - Intervention: la recomendación propuesta
        - Comparison: alternativa o placebo
        - Outcome: resultado esperado medible
      output: "claim_yaml — {population, intervention, comparison, outcome, confidence_preliminar}"
      example: >
        population: "hombres 25-40 años con IMC 25-30, sedentarios"
        intervention: "creatina monohidrato 5g/día + entrenamiento de fuerza 3x/semana"
        comparison: "entrenamiento de fuerza 3x/semana sin suplementación"
        outcome: "aumento de masa magra (DEXA) en 12 semanas"

    - step: 2
      name: "Evidence Request"
      actor: "Marina → Sara"
      description: >
        Marina prepara la solicitud estructurada y la envía a Sara
        (Evidence Analyst) via ConnectorBus.
      format: "evidence_request.yaml"
      fields:
        - "claim_id: string único"
        - "pico: {population, intervention, comparison, outcome}"
        - "study_types: [RCT, meta-analysis, systematic_review]"
        - "min_evidence_level: 1a | 1b | 2a | 2b | 3 | 4 | 5  (escala OCEBM)"
        - "max_age_years: antigüedad máxima de estudios aceptable"
        - "sample_size_min: tamaño mínimo de muestra"
        - "urgency: standard | high | critical"

    - step: 3
      name: "Evidence Search & Scoring"
      actor: "Sara (Evidence Analyst)"
      description: >
        Sara ejecuta la búsqueda en fuentes verificadas y asigna
        un score de calidad de evidencia usando el protocolo de Eidren:
        - Quality Score (0-100) basado en: tipo de estudio, tamaño de muestra,
          replicación, riesgo de sesgo (Cochrane RoB 2.0), conflicto de interés.
        - Confidence Level: HIGH | MODERATE | LOW | INSUFFICIENT.
      output: "evidence_pack.yaml con ≥1 fuente puntuada"
      tools: ["ovav-research-evidence skill", "source_scoring pipeline"]

    - step: 4
      name: "Claim Validation"
      actor: "Marina (Medical Researcher)"
      description: >
        Marina recibe el evidence_pack y determina si el claim está:
        - SUPPORTED: ≥2 estudios de calidad con resultados positivos
        - WEAK: 1 estudio o evidencia mixta
        - REJECTED: evidencia contradictoria o insuficiente
        - PENDING: se necesita más evidencia
      action:
        supported: "Incorporar al plan con confidence alta."
        weak: "Incorporar con disclaimer: 'Evidencia limitada. Monitorear respuesta.'"
        rejected: "No incorporar. Buscar alternativa."
        pending: "Solicitar búsqueda adicional."

    - step: 5
      name: "Accountability Trail"
      actor: "Renata"
      description: >
        Toda decisión se registra en accountability.jsonl con:
        - claim_id, evidence_score, confidence, decision, sources.
        CRIT-R01: 100% de recomendaciones deben ser trazables a evidencia.
      log: ".ovav/renata/accountability.jsonl"

# ── Evidence Levels (OCEBM 2011) ─────────────────────────────────────────

evidence_levels:
  1a: "Systematic review de RCTs con homogeneidad"
  1b: "RCT individual con intervalo de confianza estrecho"
  2a: "Systematic review de estudios de cohorte"
  2b: "Estudio de cohorte individual o RCT de baja calidad"
  3: "Estudio de casos y controles"
  4: "Series de casos, cohortes de baja calidad"
  5: "Opinión de experto sin valoración crítica explícita"

  health_performance_minimum:
    nutrition: "≥ 1b (RCT) — preferido 1a (meta-analysis)"
    supplementation: "≥ 1b (RCT) + verification de interacciones"
    exercise: "≥ 2b (cohorte) — estudios biomecánicos aceptados si RCT no es factible"
    recovery: "≥ 2b — aceptable evidencia de menor nivel si es consistente"

# ── Trigger Configuration ─────────────────────────────────────────────────

triggers:
  # Automático: al generar un plan nutricional
  - on: "nutrition_planner.py — output generado"
    from_lead: renata
    to_lead: eidren
    action: "evidence_verification_request"
    priority: standard
    message: "Plan nutricional generado. Solicitar evidencia para claims de macros y timing."

  # Automático: al recomendar suplementos
  - on: "supplement_checker.py — recomendación de suplemento"
    from_lead: renata
    to_lead: eidren
    action: "evidence_verification_request"
    priority: high
    message: "Suplemento recomendado. Verificar ≥2 RCTs antes de incluir en plan final."

  # Manual: cuando Marina necesita búsqueda específica
  - on: "manual_request de Marina"
    from_lead: renata
    to_lead: eidren
    action: "evidence_search_request"
    priority: standard
    message: "Búsqueda de literatura clínica solicitada por Medical Researcher."

# ── SLA ───────────────────────────────────────────────────────────────────

sla:
  standard: "72h — búsqueda y scoring completado"
  high: "24h — suplementos y claims de alto impacto"
  critical: "4h — red flag médico que requiere verificación urgente"
  escalation:
    after: "deadline + 4h"
    escalate_to: "thavren (Platform Engineering Lead)"
  tracking: ".ovav/runtime/logs/handoffs.jsonl"

# ── Integration Points ────────────────────────────────────────────────────

integration:
  connector_bus:
    entry: "cross_lead_mesh.yaml — from: renata, to: eidren"
    trigger: "claims_validados → on: health/claims_for_review.yaml"
  auto_trigger:
    entry: "handoff_auto_trigger.yaml — add trigger for health→evidence"
  registry:
    entry: "service_profiles.yaml — both health_performance and research_intelligence must be registered"

# ── Validation ────────────────────────────────────────────────────────────

validation:
  pre_handoff:
    - "Claim formulado en formato PICO"
    - "Confidence preliminar asignada"
    - "Estudio mínimo requerido especificado"
  post_handoff:
    - "≥1 fuente verificada con score"
    - "Confidence level asignado"
    - "Accountability trail registrado"
  quality_gate: "CRIT-R01 — 100% clinical evidence rate"
