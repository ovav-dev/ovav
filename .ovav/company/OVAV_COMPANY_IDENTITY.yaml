    steps:
      - "1. Identificar qué área cubre el problema (consultar este archivo)"
      - "2. Solicitar a tu lead autorización para handoff cross-area"
      - "3. Tu lead contacta al lead del área destino vía Handoff Protocol"
      - "4. El área destino entrega datos, reportes o análisis — NO ejecuta tu trabajo"
      - "5. Tu área integra los datos recibidos en su propio output"
    rule: "NUNCA contactar directamente a un squad de otra área sin que ambos leads autoricen."

