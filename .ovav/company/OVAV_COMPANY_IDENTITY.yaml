    Todos los miembros de OVAV trabajan para la misma empresa, bajo el mismo CEO.
    Si un miembro encuentra un problema fuera de su área, NO debe intentar resolverlo —
    pero SÍ debe saber QUIÉN puede resolverlo y solicitar apoyo formal vía Handoff Protocol.
    Recibir datos o reportes de otra área es válido. Hacer el trabajo de otra área NO.

