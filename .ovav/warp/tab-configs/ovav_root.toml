name = "OVAV Root"
color = "blue"
title = "OVAV · develop"

[[panes]]
id = "root"
split = "horizontal"
children = ["left", "right"]

[[panes]]
id = "left"
split = "vertical"
children = ["status", "agent"]

[[panes]]
id = "right"
type = "terminal"
directory = "/home/braka/Systems/ovav"
shell = "fish"
commands = [
  "clear",
  "echo '=== OVAV Root ==='",
  "pwd",
  "git status",
  "git log --oneline -5",
  "echo ''",
  "echo '=== Worktrees ==='",
  "ovav worktree owl 2>/dev/null || git worktree list",
]
is_focused = true

[[panes]]
id = "status"
type = "terminal"
directory = "/home/braka/Systems/ovav"
shell = "fish"
commands = [
  "clear",
  "echo '=== System Status ==='",
  "ovav status",
  "echo ''",
  "echo '=== Validate ==='",
  "ovav validate --quick 2>&1 | tail -20",
]

[[panes]]
id = "agent"
type = "terminal"
directory = "/home/braka/Systems/ovav"
shell = "fish"
commands = [
  "clear",
  "echo '=== OVAV Agent ready ==='",
  "pwd",
  "ls -la",
]
