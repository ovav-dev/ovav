name = "OVAV REVIEW"
color = "green"

[params.worktree]
type = "text"
description = "Worktree path to review"
default = ""

[params.base_branch]
type = "branch"
description = "Base branch to diff against"
default = "develop"

[[panes]]
id = "main"
type = "terminal"
directory = "{{worktree}}"
shell = "fish"
commands = [
  "ovav worktree owv",
  "git diff {{base_branch}}..HEAD --stat",
]
is_focused = true
