name = "Windows Root"
color = "magenta"
title = "Windows C:\\{{path}}"

[params.path]
type = "text"
description = "Path under /mnt/c (e.g., Users/Alexa/Documents)"
default = "Users/Alexa"

[params.shell]
type = "text"
description = "Shell to use (pwsh or cmd)"
default = "pwsh"

[[panes]]
id = "root"
split = "horizontal"
children = ["wslexplorer", "cmdspace"]

[[panes]]
id = "wslexplorer"
type = "terminal"
directory = "/mnt/c/{{path}}"
shell = "fish"
commands = [
  "ls -la /mnt/c/{{path}}",
]
is_focused = true

[[panes]]
id = "cmdspace"
type = "terminal"
directory = "/mnt/c/{{path}}"
shell = "pwsh"
commands = [
  "Get-ChildItem",
]
