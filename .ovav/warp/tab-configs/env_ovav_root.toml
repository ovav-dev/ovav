name = "OVAV Root"
color = "blue"
title = "OVAV {{worktree}}"

[params.worktree]
type = "text"
description = "OVAV worktree path (default: develop)"
default = "/home/braka/Systems/ovav"

[params.base_branch]
type = "branch"
description = "Base branch"
default = "develop"

[[panes]]
id = "root"
split = "horizontal"
children = ["left", "right"]

[[panes]]
id = "left"
split = "vertical"
children = ["editor", "status"]

[[panes]]
id = "right"
type = "agent"
directory = "{{worktree}}"
shell = "fish"
commands = [
  "ovav status",
]
is_focused = true

[[panes]]
id = "editor"
type = "terminal"
directory = "{{worktree}}"
shell = "fish"
commands = [
  "ovav worktree owl",
  "git fetch origin",
  "git status",
]

[[panes]]
id = "status"
type = "terminal"
directory = "{{worktree}}"
shell = "fish"
commands = [
  "ovav doctor --quick",
  "ovav validate --quick",
]
