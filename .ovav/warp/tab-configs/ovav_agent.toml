name = "OVAV AGENT"
color = "magenta"

[params.worktree]
type = "text"
description = "Worktree path (ovav worktree owc first)"
default = ""

[[panes]]
id = "root"
split = "horizontal"
children = ["editor", "agent"]

[[panes]]
id = "editor"
type = "terminal"
directory = "{{worktree}}"
shell = "fish"
commands = [
  "ovav status",
]

[[panes]]
id = "agent"
type = "agent"
directory = "{{worktree}}"
shell = "fish"
is_focused = true
