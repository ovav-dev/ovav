# ── Scoring methodology ──────────────────────────────────────────────────────
#
# value_score (0-100): Composite weighted score.
#   Formula: (success_rate * 0.35) + (usage_relevance * 0.25)
#          + (risk_alignment * 0.20) + (maintenance_efficiency * 0.15)
#          + (evidence_quality * 0.05) - (risk_incidents * 5)
#
# maintenance_status:
#   healthy          — value_score >= 70, no incidents in 30 days
#   needs_attention  — value_score 40-69, or 1-2 recent incidents
#   degraded         — value_score < 40, or 3+ recent incidents
#   unknown          — not enough data
#
# decision:
#   keep     — healthy, value_score >= 70
#   improve  — needs_attention, value_score 40-69
#   degrade  — degraded but still needed, value_score < 40
#   retire   — degraded and no longer needed, or superseded

scoring_methodology:
  value_score_formula:
    success_rate_weight: 0.35
    usage_relevance_weight: 0.25
    risk_alignment_weight: 0.20
    maintenance_efficiency_weight: 0.15
    evidence_quality_weight: 0.05
    incident_penalty_per_incident: 5
  thresholds:
    healthy_min: 70
    needs_attention_min: 40
    degraded_below: 40

