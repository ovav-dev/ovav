    - DESIGN.md
    - TASKS.md
    allowed_tools:
    - read
    - glob
    - grep
    denied_tools:
    - global_config_write
    - direct_memory_write
    permission_level: project_read
    memory_write: false
    risk_level: low
    evals_required:
