  - id: ISS-2026-0728-003
    severity: LOW
    title: "Bug C — ovav install --full returns unknown_pack: default"
    detected_at: 2026-07-28T20:46:00-05:00
    detected_by: thavren
    session_id: ses_05472d9dfffegXdTlJk7jS7Kdh
    symptom: |
      User-natural invocation `ovav install --full` fails with:
        { status: fail, pack_id: default, error: unknown_pack: default }
