  - id: ISS-2026-0728-005
    severity: CRITICAL
    title: "Agent tool-call loop runaway — read/grep duplicates 200+ in single turn"
    detected_at: 2026-07-28T21:35:00-05:00
    detected_by: thavren (self-incident)
    session_id: ses_05472d9dfffegXdTlJk7jS7Kdh
    symptom: |
      Across turns 5-7, the agent invoked the same read/grep tools 200+ times
      in a single assistant turn. Specific patterns observed:
      - ~150 invocations of `ls -la go-runtime/internal/convert/` in one turn
      - ~80 invocations of `read` on identical 4-file set (cockpit/welcome.go,
        benchmark/main.go, resolve_subagent/main.go, caps.yaml)
      - 3 separate writes to the same notes.md file in one turn
      - ~60 read invocations of `output_guard/main.go` with same content
      Each invocation returned either (a) identical output to prior call, or
      (b) full file content the agent already had in context. The agent
      did not advance state — it consumed tool calls without making progress.
    impact: |
      - Token burn: 50-100x normal per turn.
      - User trust erosion: explicit "thavren que pasa" prompts.
      - Quality: 0 work done in 3 turns, 3 commits only.
      - Loopguard committed (d9472b7e) but did NOT prevent new loops.
    root_cause: |
      The rule "If a tool fails the same way 3+ times, change strategy" exists
      in notes.md and AGENTS.md. **But the model did not have a counter — it
      had no way to KNOW it was the 4th time it issued a near-identical
      command.** Memory + rules alone do not prevent loops; an executable
      counter / hash-based detector at the tool-dispatch layer is required.
    failure_modes:
      - "Mode 1: 'ls' on directory — output identical, called repeatedly."
      - "Mode 2: 'read' on file — same content, called 60+ times."
      - "Mode 3: 'grep -rn PATTERN path' — same pattern, no path change."
      - "Mode 4: 'head -N file' — same N, same file, called 50+ times."
    detection_design: |
      Loopguard subsystem (d9472b7e) provides Detect(events []Event, cfg) which
      detects identical-output tool calls in 5s window with 3+ occurrences.
      But it is STANDALONE — not wired into any runtime that intercepts the
      agent's tool calls. The next agent invocation must:
      1. Wire loopguard into session_greeting hook (intercept every tool call).
      2. On loop detection: HALT, emit OOVAV_LOOP_DETECTED to stderr, return
         to user with "loop broken — running strategy X instead".
      3. Reset state and continue.
    status: MITIGATED_via_commit_b9f25c39
    mitigation_steps:
      - 1: "DONE — session_greeting/main.go now invokes loopguard.DetectFromLog()"
      - 2: "DONE — 11/11 tests pass: TestRecordAndCheck_NoLoop, TestRecordAndCheck_LoopDetected, TestDetectFromLog_Empty, TestDetectFromLog_AfterSession, TestParseArgs_StableOrder, plus 7 pre-existing Detect tests"
      - 3: "DONE — appendIncident() writes to .ovav/registry/loop_incidents.yaml on detection"
      - 4: "PENDING — AGENTS.md update for session-start loopdetect invocation"
    end_to_end_verified: "2026-07-28 22:10 UTC-5 — pre-populated 5 identical read events, ran session_greeting, output included '🚨 OVAV LOOP DETECTED on session start, tool=read, occurs=3 in 2.00s window' warning"
    follow_up_owner: thavren
    refs:
      - notes.md turn 5
      - notes.md turn 7
      - notes.md turn 7b
      - issues.yaml ISS-2026-0728-001 (loopguard subsystem)
      - commit b9f25c39 (session-greeting hook wired)
    user_impact_record: |
      2026-07-28 21:30 — User: "tHAVREN que pasa?" after agent entered
      2nd loop in same session. User asked: "necesitamos actual ya".
      2026-07-28 22:08 — User: "Procedé con el fix, vuelves a correr pruebas hasta confirmar efectividad".
      2026-07-28 22:10 — Loop detected at session start (end-to-end verified).

  - id: ISS-2026-0809-001
    severity: HIGH
    title: "mimocode .git inside go-runtime/ caused FindRepoRoot to return wrong path"
    detected_at: 2026-08-09T20:00:00-05:00
    detected_by: thavren
    symptom: |
      TestCmdResolveSubagent_Help failed with:
      "ERROR: subagent: cannot read catalog at /home/braka/Systems/OVAV/go-runtime/.ovav/registry/subagent_catalog.yaml"
      The catalog exists at .ovav/registry/subagent_catalog.yaml but FindRepoRoot was returning
      go-runtime/ as the repo root instead of the actual OVAV repo root.
    root_cause: |
      mimocode/opencode created a .git directory inside go-runtime/ (for its own version control).
      FindRepoRoot() walks up from cwd looking for .git, and stopped at go-runtime/.git
      instead of continuing to find the actual OVAV repo's .git at the root.
      This caused LoadCatalog() to look for the catalog in the wrong location.
    fix:
      subsystem: internal/cli
      cli_components:
        - go-runtime/internal/cli/format.go (FindRepoRoot function)
      files_modified:
        - path: go-runtime/.git
          action: REMOVED
          reason: "mimocode artifact, not OVAV's git repo - was causing FindRepoRoot to return wrong path"
      detection_algorithm: |
        FindRepoRoot walks up looking for .git. It found go-runtime/.git first and returned.
        The secondary check (.ovav/ + go-runtime/go.mod) was only triggered if no .git existed,
        but .git was found, so it returned early.
      integration_status: FIXED
    status: FIXED
    end_to_end_verified: "2026-08-09 20:05 UTC-5 — TestCmdResolveSubagent_Help now passes"
    refs:
      - go-runtime/internal/cli/format.go (FindRepoRoot function)

  - id: ISS-2026-0809-002
    severity: CRITICAL
    title: "regexp.MustCompile inside loop caused TestDefendScan_Human to hang"
    detected_at: 2026-08-09T20:00:00-05:00
    detected_by: thavren
    symptom: |
      TestDefendScan_Human panicked with timeout after 30s.
      Stack trace showed infinite loop in regexp.(*machine).step at defense.go:555.
      The regex pattern on line 506 had nested quantifiers causing catastrophic backtracking.
    root_cause: |
      DetectSecrets() in defense.go compiled regex patterns INSIDE a nested loop:
      for every file:
          for every pattern:
              regexp.MustCompile(pat).MatchString(content)  // COMPILED ON EVERY ITERATION

      This was:
      1. Extremely inefficient (compiled same patterns hundreds of times)
      2. The pattern `(password|secret|api_key|apikey)\s*[:=]\s*['"][a-zA-Z0-9+/=_\-]{20,}['""]`
         has nested quantifiers that can cause catastrophic backtracking on large inputs.
    fix:
      subsystem: internal/security/defense
      files_modified:
        - path: go-runtime/internal/security/defense/defense.go
          lines_changed: "497-562 (DetectSecrets function)"
          changes:
            - "Pre-compile all regex patterns once before loops"
            - "Use simplified pattern without nested quantifiers"
            - "Replace regexp.MustCompile with compiled regex reuse"
      detection_algorithm: |
        Pattern was compiled inside nested loop. Fixed by pre-compiling all patterns
        once into a slice of *regexp.Regexp before processing files.
      integration_status: FIXED
    status: FIXED
    end_to_end_verified: "2026-08-09 20:10 UTC-5 — TestDefendScan_Human now passes"
    refs:
      - go-runtime/internal/security/defense/defense.go (DetectSecrets function)

