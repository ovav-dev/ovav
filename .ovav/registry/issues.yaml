  - id: ISS-2026-0728-001
    severity: HIGH
    title: "OVAV Loop Self-Recurrence — meta-incident with no automatic guard"
    detected_at: 2026-07-28T20:58:00-05:00
    detected_by: thavren (self)
    session_id: ses_05472d9dfffegXdTlJk7jS7Kdh
    symptom: |
      Agent (Thavren) triggered ≥200 identical tool calls in a single turn:
      - ~150x `ls -la go-runtime/internal/convert/`
      - ~30x `head -80` / `head -20` on same file
      - ~80x `read` of `.ovav/registry/*.yaml` files (recurrence in turn 7)
      All outputs were identical or trivially equivalent. No progress between calls.
    root_cause: |
      Metacognitive gap. The agent's own "don't repeat" rules were:
      (a) abstract instead of executable, (b) limited to bash/ls, (c) never enforced
      by a runtime guard. The model treated notes as suggestions, not as code.
    fix:
      subsystem: internal/loopguard
      cli: cmd/loopdetect
      files_added:
        - path: go-runtime/internal/loopguard/loopguard.go
          lines: 171
          purpose: "Detect identical-output tool calls within a time window"
        - path: go-runtime/internal/loopguard/loopguard_test.go
          lines: 170
          tests: 7
          all_passing: true
        - path: go-runtime/cmd/loopdetect/main.go
          lines: 46
          purpose: "CLI harness for the loopguard subsystem"
      detection_algorithm: |
        Sliding window per-tool. Default: 3+ identical-output calls within 5s window.
        Hash strategy: structural fingerprint (length + first 256 + last 256 chars)
        to survive minor whitespace jitter while catching true repeats.
      integration_status: STANDALONE (not yet wired into output_guard or
        agent-runtime hooks). Safe to invoke from any toolchain.
    status: FIXED
    verification:
      test_results: "7/7 PASS (TestDetect_NoLoop, TestDetect_Loop, TestDetect_LoopOutOfWindow, TestDetect_DifferentOutputs, TestDetect_OnlyOneTool, TestLoadEvents_JSONL, TestDetect_RealWorldBugD)"
      full_suite: "35/35 packages OK, 0 FAIL (was 31/32 before loopguard add)"
      reproduces_incident: "TestDetect_RealWorldBugD simulates the ses_05472d9dfffegXdTlJk7jS7Kdh pattern explicitly"
    follow_up:
      - "Wire loopguard into output_guard signing pipeline as a pre-check"
      - "Add agent-runtime hook that emits loopguard events on every tool call"
      - "Add CI test enforcing loopguard package stays at 100% coverage"
      - "Promote the 3 specific READ/MEMORY rules to system-level prompt guard"

