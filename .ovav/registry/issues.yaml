  - id: ISS-2026-0809-004
    severity: MEDIUM
    title: "internal/project tests fail due to git identity not configured"
    detected_at: 2026-08-09T20:15:00-05:00
    detected_by: thavren
    symptom: |
      TestDetectCurrentChanges_EmptyRepo and TestDetectCurrentChanges_WithChanges fail with:
      "git [commit --allow-empty -m init]: exit status 128
       Identidad del autor desconocido.
       fatal: no se puede tener un nombre de identidad vacío"
      Tests create temporary git repos but don't configure user.email/user.name.
    root_cause: |
      Tests in coverage_boost_test.go create temp git repos and try to make commits,
      but don't set GIT_AUTHOR_NAME/EMAIL or git config user.email/user.name.
      The system git config is not set for this user (braka).
    fix:
      subsystem: internal/project
      files_needing_fix:
        - path: go-runtime/internal/project/coverage_boost_test.go
          functions:
            - TestDetectCurrentChanges_EmptyRepo
            - TestDetectCurrentChanges_WithChanges
      recommended_fix: |
        Set git config in test setup:
        os.Setenv("GIT_AUTHOR_NAME", "Test User")
        os.Setenv("GIT_AUTHOR_EMAIL", "test@example.com")
        Or use exec.Command with -c to set config per-command.
      integration_status: PENDING
    status: OPEN
    refs:
      - go-runtime/internal/project/coverage_boost_test.go

