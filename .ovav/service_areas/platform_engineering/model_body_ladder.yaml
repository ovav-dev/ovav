# Model Body Ladder — Platform Engineering v5.0
# Active providers: OpenAI GPT (primary) + MiniMax API (fallback/small).

model_body_ladder:
  version: "5.0.0"
  area: platform_engineering
  strategy: "dual_provider_gpt_primary_minimax_fallback"
  default_model: "openai/gpt-5.6-luna"
  small_model: "minimax-coding-plan/MiniMax-M3"
  providers:
    primary:
      id: "openai/gpt-5.6-luna"
      provider: openai
      subscription: "GPT via API/browser"
    fallback:
      id: "minimax-coding-plan/MiniMax-M3"
      provider: minimax-coding-plan
      subscription: "MiniMax API coding plan"

  assignments:
    lead: {primary: "openai/gpt-5.6-luna", fallback: "minimax-coding-plan/MiniMax-M3"}
    squad: {primary: "openai/gpt-5.6-luna", fallback: "minimax-coding-plan/MiniMax-M3"}
    governor: {primary: "openai/gpt-5.6-luna", fallback: "minimax-coding-plan/MiniMax-M3"}

  routing:
    architecture_design: {primary: "openai/gpt-5.6-luna", fallback: "minimax-coding-plan/MiniMax-M3"}
    heavy_implementation: {primary: "openai/gpt-5.6-luna", fallback: "minimax-coding-plan/MiniMax-M3"}
    security_audit: {primary: "openai/gpt-5.6-luna", fallback: "minimax-coding-plan/MiniMax-M3"}
    code_review: {primary: "openai/gpt-5.6-luna", fallback: "minimax-coding-plan/MiniMax-M3"}
    testing_qa: {primary: "openai/gpt-5.6-luna", fallback: "minimax-coding-plan/MiniMax-M3"}
    install_planning: {primary: "openai/gpt-5.6-luna", fallback: "minimax-coding-plan/MiniMax-M3"}
    benchmarking: {primary: "openai/gpt-5.6-luna", fallback: "minimax-coding-plan/MiniMax-M3"}
    research_evidence: {primary: "openai/gpt-5.6-luna", fallback: "minimax-coding-plan/MiniMax-M3"}
    deep_exploration: {primary: "openai/gpt-5.6-luna", fallback: "minimax-coding-plan/MiniMax-M3"}
    quick_exploration: {primary: "openai/gpt-5.6-luna", fallback: "minimax-coding-plan/MiniMax-M3"}
    small_patches: {primary: "openai/gpt-5.6-luna", fallback: "minimax-coding-plan/MiniMax-M3"}
    summarization: {primary: "openai/gpt-5.6-luna", fallback: "minimax-coding-plan/MiniMax-M3"}
    conversation_diagnosis: {primary: "openai/gpt-5.6-luna", fallback: "minimax-coding-plan/MiniMax-M3"}

  fallback_policy:
    trigger: [credit_exhaustion, repeated_errors, latency_spike]
    order: ["openai/gpt-5.6-luna", "minimax-coding-plan/MiniMax-M3"]
    exhausted_action: safe_stop_and_alert_user
    cross_provider: true

  active_model_families:
    - "openai/gpt-5.6-luna"
    - "minimax-coding-plan/MiniMax-M3"
