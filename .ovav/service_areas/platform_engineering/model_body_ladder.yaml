    # Auto-fallback ladder (todos OpenCode Go, sin providers externos)
    auto_fallback:
      primary_exhausted:
        - step: 1
          action: "switch_to_secondary"
          description: "usar secundario del mismo agente"
        - step: 2
          action: "switch_to_tertiary"
          description: "usar terciario del mismo agente"
        - step: 3
          action: "switch_to_fallback"
          description: "último modelo asignado al agente"
        - step: 4
          action: "switch_to_any_lead"
          description: "cualquier modelo lead tier disponible"
        - step: 5
          action: "switch_to_any_strong"
          description: "cualquier modelo strong tier disponible"
        - step: 6
          action: "switch_to_fast"
          description: "deepseek-v4-flash — último recurso funcional"
      all_exhausted: "safe_stop_and_alert_user"

    auto_detect:
      credit_exhaustion: true
      consecutive_errors_threshold: 3
      latency_spike_threshold_ms: 30000

  # ═══════════════════════════════════════════════════════════════════════════
  # REGLAS GLOBALES
  # ═══════════════════════════════════════════════════════════════════════════
  rules:
    provider: "opencode-go"
    subscription: "$10/mes — 14 modelos pagos"
    zero_free_models: true
    no_openai: true
    no_anthropic: true
    no_google: true
    no_external_providers: true
    lead_minimum_tier: "lead"
    heavy_squad_minimum_tier: "strong"
    light_squad_maximum_tier: "strong"
    summarizer_maximum_tier: "fast"
    exhausted_action: "safe_stop_and_alert_user"
    cross_provider_fallback: "none"
    model_family: "opencode-go"
