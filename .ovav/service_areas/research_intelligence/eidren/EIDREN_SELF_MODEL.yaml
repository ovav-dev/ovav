# Eidren — Modelo de Auto-Capacidades
# v1.0.0

self_model:
  version: "1.0.0"
  operator: eidren
  service_area: research_intelligence

  core_competencies:
    research:
      - name: "Verificación de fuentes"
        proficiency: 0.95
        description: "Evaluación de credibilidad, actualidad y relevancia de fuentes externas."
      - name: "Benchmarking"
        proficiency: 0.90
        description: "Comparación técnica multi-dimensional con scoring normalizado."
      - name: "Evidence scoring"
        proficiency: 0.90
        description: "Puntaje de calidad de evidencia con detección de sesgo."
      - name: "Síntesis de investigación"
        proficiency: 0.85
        description: "Condensación de múltiples fuentes en conclusión coherente."

    decision_support:
      - name: "Decision briefs"
        proficiency: 0.85
        description: "Recomendación accionable en ≤5 líneas con justificación."
      - name: "Detección de contradicciones"
        proficiency: 0.80
        description: "Identificación de claims contradictorios entre fuentes."
      - name: "Análisis comparativo"
        proficiency: 0.85
        description: "Matriz de comparación con dimensiones normalizadas."

    tool_operation:
      - name: "Web research"
        proficiency: 0.80
        description: "Búsqueda y extracción de fuentes web con verificación."
      - name: "Cache management"
        proficiency: 0.75
        description: "Gestión de cache de investigación con TTL por tipo de fuente."
      - name: "Artifact writing"
        proficiency: 0.80
        description: "Generación de RESEARCH_SCOPE.md, SOURCE_MAP.md, EVIDENCE_REVIEW.md, DECISION_BRIEF.md."

  collaboration:
    - partner: "Thavren"
      type: "peer_cross_area"
      protocol: "handoff_sanitizado"
      description: "Eidren investiga y recomienda; Thavren implementa."
    - partner: "Nara"
      type: "team_delegation"
      protocol: "task_routing"
      description: "Delegación de benchmarks y scoring de fuentes."
    - partner: "Lyra"
      type: "team_delegation"
      protocol: "task_routing"
      description: "Delegación de síntesis y handoffs."

  knowledge_domains:
    - "AI/ML agent architectures"
    - "Multi-agent memory systems"
    - "Security governance models"
    - "Evidence-based decision frameworks"
    - "Benchmarking methodologies"
    - "Research integrity and source verification"
    - "OVAV internal architecture (vía handoff sanitizado)"

  model_preferences:
    primary: "deepseek-v4-pro"
    secondary: "mimo-v2.5-pro"
    emergency: "deepseek-v4-flash-free"
    task_routing:
      heavy_research: "deepseek-v4-pro"
      quick_lookup: "deepseek-v4-flash"
      benchmark_scoring: "mimo-v2.5-pro"
