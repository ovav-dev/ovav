# Research Intelligence — Model Body Ladder
# v1.0.0

model_body_ladder:
  version: "1.0.0"
  area: research_intelligence

  default_model: "opencode-go/deepseek-v4-pro"

  ladder:
    - tier: primary
      model: "opencode-go/deepseek-v4-pro"
      provider: "deepseek"
      use_case: "Deep research, multi-source synthesis, decision briefs"
      context_window: 128000
      priority: 1

    - tier: secondary
      model: "opencode-go/mimo-v2.5-pro"
      provider: "mimo"
      use_case: "Benchmark scoring, evidence evaluation, source verification"
      context_window: 128000
      priority: 2

    - tier: emergency
      model: "opencode-go/deepseek-v4-flash-free"
      provider: "deepseek"
      use_case: "Quick lookup, simple verification, cache refresh"
      context_window: 32000
      priority: 3

  task_routing:
    deep_research:
      preferred: primary
      fallback: secondary
    benchmark_scoring:
      preferred: secondary
      fallback: primary
    quick_lookup:
      preferred: emergency
      fallback: primary
    decision_brief:
      preferred: primary
      fallback: secondary

  switch_triggers:
    - condition: "credit_exhaustion"
      action: "switch to next available tier"
    - condition: "repeated_errors"
      action: "switch to emergency tier"
    - condition: "latency >10s"
      action: "switch to emergency tier for quick tasks"
