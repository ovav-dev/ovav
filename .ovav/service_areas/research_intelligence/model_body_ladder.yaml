# Research Intelligence — Model Body Ladder

model_body_ladder:
  version: "2.0.0"
  area: research_intelligence
  strategy: dual_provider
  default_model: "openai/gpt-5.6-luna"
  small_model: "minimax-coding-plan/MiniMax-M3"
  ladder:
    - {tier: primary, model: "openai/gpt-5.6-luna", provider: openai, use_case: "Deep research and decision briefs", priority: 1}
    - {tier: fallback, model: "minimax-coding-plan/MiniMax-M3", provider: minimax-coding-plan, use_case: "Benchmark scoring and quick lookup", priority: 2}
  task_routing:
    deep_research: {preferred: primary, fallback: fallback}
    benchmark_scoring: {preferred: primary, fallback: fallback}
    quick_lookup: {preferred: fallback, fallback: primary}
    decision_brief: {preferred: primary, fallback: fallback}
  switch_triggers: [credit_exhaustion, repeated_errors, latency_spike]
