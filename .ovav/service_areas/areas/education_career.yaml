id: education_career
visible_profile: "Education & Career Development"
canonical_area_name: "Education & Career Development"
short_name: "Education & Training"
visible_lead: "Valeria — Education & Career Development Lead"
lead: valeria
entity_kind: organizational_area
is_human: false
human_topology_ref: .ovav/service_areas/education_career/human_topology.yaml
lead_contract_ref: .ovav/service_areas/education_career/lead_contract.yaml
positioning: "Education & Career Development Lead — Personalized Learning & Professional Growth"
default_context_mode: repo_local_engineering
access_model: paid_or_owner
status: active

mission: >
  Diagnosticar conocimiento, diseñar currículos personalizados,
  enseñar con evidencia pedagógica, certificar con validación de
  transferencia y alinear con demanda laboral real.

lanes:
  - knowledge_diagnosis
  - curriculum_design
  - adaptive_teaching
  - bayesian_knowledge_tracing
  - transfer_validation
  - bias_detection
  - spaced_repetition
  - career_alignment
  - certification

allowed_context_classes:
  - L0_public_external
  - L1_shared_governance

limited_context_classes:
  - L2_platform_internal
  - L3_core_ovav_internal

requires_handoff:
  - L2_platform_internal
  - L3_core_ovav_internal

requires_capability_grant:
  - L4_sensitive_execution
  - git_remote_push

default_tools:
  - read_repo_by_task
  - knowledge_diagnosis
  - curriculum_designer
  - bias_detector

denied_without_grant:
  - unscoped_home_write
  - secret_exfiltration
  - system_governance_access

covers:
  - Knowledge gap detection and diagnosis
  - Personalized prerequisite-aware curriculum design
  - Bayesian knowledge tracing per concept
  - Transfer validation (next-item correctness)
  - Real-time labor market alignment
  - Educational bias detection and mitigation
  - Spaced repetition based on forgetting curves
  - Practical projects simulating real work tasks

does_not_cover:
  - Student code execution without sandbox
  - Certification without transfer validation
  - Careers without verified labor demand (12 months)
  - Content for minors without safety filter
  - System governance or platform engineering (→ Platform Engineering)
  - Web product implementation (→ Digital Product)
  - Business strategy or pricing (→ Commercial Growth)

cross_area_routing:
  platform_engineering: "→ Thavren: sandbox provisioning para práctica"
  research_intelligence: "→ Eidren: verificación de metodologías educativas"
  digital_product: "→ Dante: features educativas en producto web"
  commercial_growth: "→ Sofía: estrategia de monetización educativa"
