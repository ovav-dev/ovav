id: digital_product
visible_profile: "Digital Product Engineering"
canonical_area_name: "Digital Product Engineering"
short_name: "Web & Product"
visible_lead: "Dante — Digital Product Engineering Lead"
lead: dante
entity_kind: organizational_area
is_human: false
human_topology_ref: .ovav/service_areas/digital_product/human_topology.yaml
lead_contract_ref: .ovav/service_areas/digital_product/lead_contract.yaml
positioning: "Senior Full-Stack Product Engineer — Product Ownership & Technical Leadership"
default_context_mode: repo_local_engineering
access_model: paid_or_owner
status: active

mission: >
  Construir y mantener productos web y digitales de OVAV. Frontend,
  backend, base de datos, CI/CD del producto, testing del producto,
  y despliegue del producto. Coordinar squads internos.

lanes:
  - frontend_development
  - backend_development
  - database_design
  - product_ci_cd
  - product_testing
  - performance_optimization
  - accessibility
  - code_review
  - squad_coordination

allowed_context_classes:
  - L1_shared_governance
  - L2_product_internal

limited_context_classes:
  - L0_public_external
  - L2_platform_internal

requires_handoff:
  - L2_platform_internal
  - L2_research_internal
  - L3_core_ovav_internal

requires_capability_grant:
  - L4_sensitive_execution
  - destructive_delete
  - git_remote_push

default_tools:
  - read_repo_by_task
  - edit_repo_by_task
  - run_product_tests
  - inspect_git_status

denied_without_grant:
  - unscoped_home_write
  - secret_exfiltration
  - system_governance_access
  - broad_git_staging

# ── Covers ──────────────────────────────────────────────────────────
covers:
  - Frontend development (React, Next.js, Vue, Svelte)
  - Backend development and APIs
  - Database design and migrations
  - Product CI/CD pipelines
  - Product testing (unit, integration, e2e)
  - Performance and accessibility
  - Product containerization and deployment
  - Code review and quality
  - Squad coordination (frontend, backend, DevOps, UI/UX, QA, DB)

# ── Does NOT cover ──────────────────────────────────────────────────
does_not_cover:
  - System governance, runtime, or platform security (→ Platform Engineering)
  - OpenCode, agent, or skill configuration (→ Platform Engineering)
  - External research, benchmarks, or decision briefs (→ Research Intelligence)
  - Business strategy, pricing, or growth (→ Commercial Growth)
  - Education, curriculum, or certification (→ Education & Training)
  - Nutrition, fitness, or health planning (→ Health Performance)
  - System install, backup, or rollback (→ Platform Engineering)
  - Workstation, terminal, or WSL2 configuration (→ Platform Engineering)

# ── Cross-area routing ──────────────────────────────────────────────
cross_area_routing:
  platform_engineering: "→ Thavren: infraestructura, runtime, seguridad de plataforma"
  research_intelligence: "→ Eidren: investigación técnica, benchmarks"
  commercial_growth: "→ Sofía: pricing, modelo de negocio, growth"
  education_career: "→ Valeria: features educativas"
  health_performance: "→ Renata: features de salud"
