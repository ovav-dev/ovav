model_body_ladder:
  version: "2.0.0"
  area: adversarial_intelligence
  strategy: dual_provider
  default_model: "openai/gpt-5.6-luna"
  small_model: "minimax-coding-plan/MiniMax-M3"
  tiers:
    ultra:
      models: ["openai/gpt-5.6-luna"]
      use_cases: ["attack_simulation", "architectural_audit", "race_condition_analysis"]
    standard:
      models: ["openai/gpt-5.6-luna", "minimax-coding-plan/MiniMax-M3"]
      use_cases: ["boundary_testing", "drift_detection", "report_generation"]
    lite:
      models: ["minimax-coding-plan/MiniMax-M3"]
      use_cases: ["semantic_scan", "quick_boundary_check", "prompt_injection_sweep"]
