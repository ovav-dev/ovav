model_body_ladder:
  version: "2.0.0"
  area: legal_compliance
  strategy: dual_provider
  default_model: "openai/gpt-5.6-luna"
  small_model: "minimax-coding-plan/MiniMax-M3"
  tiers:
    ultra:
      models: ["openai/gpt-5.6-luna"]
      use_cases: ["complex_contract_review", "regulatory_analysis", "risk_assessment"]
    standard:
      models: ["openai/gpt-5.6-luna", "minimax-coding-plan/MiniMax-M3"]
      use_cases: ["standard_contract_drafting", "compliance_check", "ip_review"]
    lite:
      models: ["minimax-coding-plan/MiniMax-M3"]
      use_cases: ["quick_license_check", "tos_review"]
