model_budget_policy:
  version: "1.0"
  purpose: "Keep delegation economical without weakening lead judgment, safety or final accountability."

  principles:
    - Keep broad reads and repeated scans away from the lead context when delegation can compress them first.
    - Use the strongest available model for architecture, security, critical code and final accountability.
    - Never trade source fidelity, safety or traceability for lower token cost.
    - Prefer compiled findings over raw logs and repeated tool output.

  delegation_rules:
    - delegate_large_docs_before_summarizing
    - delegate_repeated_pattern_scans
    - lead_context_for_judgment_not_bulk_reading

  providers:
    default: openai
    fallback: minimax-coding-plan
    default_model: "openai/gpt-5.6-luna"
    fallback_model: "minimax-coding-plan/MiniMax-M3"

  routes:
    external_research_bulk:
      default: "openai/gpt-5.6-luna"
      fallback: "minimax-coding-plan/MiniMax-M3"
    comparison_matrix:
      default: "openai/gpt-5.6-luna"
      fallback: "minimax-coding-plan/MiniMax-M3"
    daily_implementation:
      default: "openai/gpt-5.6-luna"
      fallback: "minimax-coding-plan/MiniMax-M3"
    critical_code_or_harness_closure:
      default: "openai/gpt-5.6-luna"
      fallback: "minimax-coding-plan/MiniMax-M3"
    architecture_review:
      default: "openai/gpt-5.6-luna"
      fallback: "minimax-coding-plan/MiniMax-M3"
    logs_tool_outputs:
      default: "minimax-coding-plan/MiniMax-M3"
      fallback: "openai/gpt-5.6-luna"
    long_document_or_repo_audit:
      default: "openai/gpt-5.6-luna"
      fallback: "minimax-coding-plan/MiniMax-M3"
      rule: "Delegate broad reads, file inventories and repeated pattern scans before loading them into the lead context."
    lead_final_judgment:
      default: "openai/gpt-5.6-luna"
      fallback: "minimax-coding-plan/MiniMax-M3"
      rule: "Use the strongest lead body for architecture decisions, sensitive safety boundaries, final synthesis and user-facing accountability."

  operational_rules:
    - Do not use one model for every step when a task naturally separates into exploration, implementation, review, QA and synthesis.
    - Prefer MiniMax for small or fallback work; use GPT for default judgment and implementation.
    - Preserve Thavren's context for judgment, architecture, safety and final delivery.
    - Every delegation must remain governed by service area, context gateway, tool gateway and visible-surface boundaries.
    - Every escalation must remain traceable and stay within the two active providers.

  budget:
    monthly_budget_usd: 200.0
    per_session_limit_usd: 10.0
    warning_threshold: 0.7
    escalation_threshold: 0.85
    auto_stop_threshold: 1.0
    cost_estimation_enabled: true
    cumulative_tracking: true

  provider_preferences:
    openai:
      accounts: [ovav]
      default_account: ovav
      fallback_provider: minimax-coding-plan
    minimax-coding-plan:
      accounts: [ovav]
      default_account: ovav
      fallback_provider: openai

# LAW-001 governance: .ovav/laws/area_boundary_enforcement.yaml (Non-Invasion Area Boundary Law)
