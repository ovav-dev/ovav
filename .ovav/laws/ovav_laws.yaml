# ── Group 1: Product Laws ────────────────────────────────────────────────────
product_laws:
  description: >
    Evalúan si una propuesta genera valor real al usuario o al sistema.
    Sin estas, OVAV acumularía features sin propósito.

  laws:
    - id: LAW-01
      name: automation_useful
      group: product_laws
      question: "¿Esto automatiza una carga real del usuario o del sistema?"
      severity: required
      activation: always
      authority_sources:
        - .ovav/service_areas/shared/lead_work_method_contract.yaml
      f0_integration: []
      fail_means: "La propuesta no resuelve un problema real."

    - id: LAW-02
      name: practical_value
      group: product_laws
      question: "¿Esto resuelve una necesidad real del usuario o del sistema?"
      severity: required
      activation: always
      authority_sources:
        - AGENTS.md
        - docs/system/01_ARCHITECTURE.md
      f0_integration: []
      fail_means: "La propuesta no tiene valor práctico demostrable."

    - id: LAW-03
      name: friction_reduction
      group: product_laws
      question: "¿Esto reduce comandos, decisiones o trabajo manual?"
      severity: required_for_medium_plus
      activation: task_size in [medium, complex, critical]
      authority_sources:
        - .ovav/service_areas/shared/context_economy_contract.yaml
      f0_integration: []
      fail_means: "La propuesta añade fricción en lugar de reducirla."

    - id: LAW-04
      name: intelligent_experience
      group: product_laws
      question: "¿El usuario ve contexto, riesgo, progreso, resultado y siguiente paso?"
      severity: required_for_user_visible
      activation: user_visible_change == true
      authority_sources:
        - .ovav/service_areas/shared/visual_delivery_contract.yaml
      f0_integration: []
      fail_means: "La experiencia no comunica estado ni decisiones."

# ── Group 2: Authority Laws ──────────────────────────────────────────────────
authority_laws:
  description: >
    Evalúan si la propuesta respeta la autoridad canónica y no crea
    fuentes de verdad duplicadas o conflictivas.

  laws:
    - id: LAW-05
      name: state_truth
      group: authority_laws
      question: "¿Se verificó repo, rama, status y autoridad actual antes de actuar?"
      severity: required_for_implementation
      activation: task_size in [medium, complex, critical]
      authority_sources:
        - .ovav/plan/caps.yaml
        - tools/harnesses/workspace_safety_gate.py
      f0_integration: [0.5_secure_bootstrapping]
      fail_means: "Se actuó sin verificar el estado real del sistema."
      note: "current_authority_contract.yaml eliminado 2026-06-11. IMPLEMENTATION_PLAN.md deprecado 2026-06-14. Git HEAD + .ovav/plan/caps.yaml es la fuente canónica."

    - id: LAW-06
      name: single_authority
      group: authority_laws
      question: "¿Esto evita fuentes de verdad duplicadas o conflictivas?"
      severity: required_for_runtime_and_docs
      activation: touched_surfaces includes docs or .ovav or registry
      authority_sources:
        - .ovav/policy/permission_authority.json
        - .ovav/policy/canonical_paths.json
      f0_integration: [0.5_secure_bootstrapping]
      fail_means: "Se creó una segunda fuente de verdad para algo que ya existe."

    - id: LAW-07
      name: semantic_drift_free
      group: authority_laws
      question: "¿Docs, registry, agentes, runtime y permisos dicen la misma verdad?"
      severity: blocking_if_high
      activation: always
      authority_sources:
        - tools/validators/check_permission_policy_drift.py
        - tools/validators/check_host_config_drift.py
        - tools/validators/check_agent_runtime_enforcement.py
      f0_integration: [0.3_runtime_integrity]
      fail_means: "Hay contradicción entre lo que dicen los archivos y lo que ejecuta el runtime."

# ── Group 3: Identity Laws ───────────────────────────────────────────────────
identity_laws:
  description: >
    Evalúan si la propuesta respeta la identidad profesional persistente
    de OVAV y no degrada la separación entre cuerpo (modelo) e identidad.

  laws:
    - id: LAW-08
      name: persistent_identity
      group: identity_laws
      question: "¿El rol preserva su identidad independiente del modelo que lo ejecuta?"
      severity: required_for_agent_role_changes
      activation: touched_surfaces includes .opencode/agents or service_areas
      authority_sources:
        - docs/system/00_IDENTITY.md
        - tools/agent_runtime/identity_guard.py
      f0_integration: [0.5_secure_bootstrapping]
      fail_means: "La identidad del perfil depende del modelo, no de los contratos."

    - id: LAW-09
      name: service_area_alignment
      group: identity_laws
      question: "¿Esto se alinea con el service_area, lead, lanes y delivery contract?"
      severity: required_for_profile_changes
      activation: touched_surfaces includes .ovav/service_areas
      authority_sources:
        - .ovav/service_areas/areas/platform_engineering.yaml
        - .ovav/service_areas/areas/research_intelligence.yaml
      f0_integration: []
      fail_means: "La propuesta viola los límites del perfil profesional."

    - id: LAW-10
      name: human_professional_delivery
      group: identity_laws
      question: "¿Esto se comporta como un lead profesional, no como un agente robótico?"
      severity: required_for_user_visible_agent_surface
      activation: user_visible_change == true
      authority_sources:
        - .ovav/service_areas/shared/visual_delivery_contract.yaml
        - .ovav/service_areas/shared/lead_work_method_contract.yaml
      f0_integration: []
      fail_means: "La entrega parece generada por máquina, no por un profesional."

# ── Group 4: Context / Tool Laws ─────────────────────────────────────────────
context_tool_laws:
  description: >
    Evalúan si la propuesta respeta los límites de contexto, herramientas
    y no usa similitud semántica como autorización implícita.

  laws:
    - id: LAW-11
      name: zero_trust_context
      group: context_tool_laws
      question: "¿Se clasificó el contexto antes de usarlo (fuente, autoridad, frescura, scope, riesgo)?"
      severity: required
      activation: always
      authority_sources:
        - .ovav/service_areas/shared/context_firewall.yaml
        - .ovav/service_areas/shared/context_economy_contract.yaml
      f0_integration: [0.4_network_hardening, 0.6_anti_exfiltration]
      fail_means: "Se cargó contexto sin verificar su procedencia o autoridad."

    - id: LAW-12
      name: minimum_sufficient_context
      group: context_tool_laws
      question: "¿Se cargó solo el contexto necesario (T0-T5)?"
      severity: required
      activation: always
      authority_sources:
        - .ovav/service_areas/shared/context_economy_contract.yaml
        - docs/26_RUNTIME_CONTEXT_BUDGET.md
      f0_integration: []
      fail_means: "Se cargó más contexto del necesario sin justificación."

    - id: LAW-13
      name: governed_tools
      group: context_tool_laws
      question: "¿El uso de herramientas fue autorizado por perfil, modo, riesgo y grant?"
      severity: blocking
      activation: always
      authority_sources:
        - .ovav/policy/permission_authority.json
        - .ovav/service_areas/shared/tool_access_policy.yaml
        - tools/permissions/bash_commands.py
        - tools/permissions/unsafe_selectors.py
      f0_integration: [0.4_network_hardening, 0.5_secure_bootstrapping]
      fail_means: "Se usó una herramienta sin pasar por los gates de permiso."

    - id: LAW-14
      name: no_semantic_authorization
      group: context_tool_laws
      question: "¿Se evitó que similitud semántica se convierta en permiso?"
      severity: blocking
      activation: always
      authority_sources:
        - .ovav/policy/permission_authority.json
        - tools/permissions/rego_engine.py
      f0_integration: [0.3_runtime_integrity]
      fail_means: "Se concedió acceso porque 'sonaba parecido', no porque estaba autorizado."

# ── Group 5: Execution Laws ──────────────────────────────────────────────────
execution_laws:
  description: >
    Evalúan si la propuesta deja evidencia, dispara reflejos automáticos
    y permite trazabilidad completa de la intención al resultado.

  laws:
    - id: LAW-15
      name: automatic_reflexes
      group: execution_laws
      question: "¿Los archivos tocados dispararon los harnesses correctos?"
      severity: required_for_medium_plus
      activation: task_size in [medium, complex, critical]
      authority_sources:
        - tools/agent_runtime/harness_router.py
        - .ovav/registry/surface_validator_map.yaml
      f0_integration: [0.3_runtime_integrity]
      fail_means: "Se modificaron archivos sin ejecutar los validadores correspondientes."

    - id: LAW-16
      name: evidence_required
      group: execution_laws
      question: "¿Hay evidencia de qué cambió, qué se validó y qué riesgo quedó?"
      severity: required_for_nontrivial
      activation: task_size not in [micro]
      authority_sources:
        - tools/agent_runtime/observability_engine.py
        - .ovav/service_areas/shared/safe_stop_contract.yaml
      f0_integration: [0.6_anti_exfiltration]
      fail_means: "No hay trazabilidad de lo que se hizo ni de su validación."

    - id: LAW-17
      name: intent_to_evidence_chain
      group: execution_laws
      question: "¿Se puede trazar la acción desde la intención del usuario hasta el resultado?"
      severity: required_for_complex_or_critical
      activation: task_size in [complex, critical]
      authority_sources:
        - tools/agent_runtime/observability_engine.py
        - git log + .ovav/plan/caps.yaml
      f0_integration: [0.3_runtime_integrity, 0.6_anti_exfiltration]
      fail_means: "No se puede reconstruir qué se pidió → qué se decidió → qué se hizo."

