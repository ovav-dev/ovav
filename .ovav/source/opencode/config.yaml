version: '1.0'
schema: https://opencode.ai/config.json
_ovav:
  policy: yolo-trusted-domain
  version: yolo-2026-08-13
  managed_by: .ovav/policy/permission_authority.json
  rationale: OVAV TRUSTED DOMAIN — host does not re-ask when OVAV governor decides.
  autonomous: true
  wildcard_global: true
runtime:
  model: openai/gpt-5.6-luna
  small_model: minimax-coding-plan/MiniMax-M3
  # OpenCode's stable internal entrypoint delegates to the visible area prompt.
  default_agent: default
  default_permission: allow
  instructions:
  - opencode_AGENTS.md
  agent:
    default:
      name: default
      description: OVAV default agent — delegates to Platform Engineering lead
      mode: primary
      prompt: '{file:/home/braka/Systems/ovav/.opencode/agents/area-platform-engineering.md}'
      tools:
        bash: true
        edit: true
        write: true
        read: true
        glob: true
        grep: true
        list: true
        patch: true
        task: true
        skill: true
        webfetch: true
        websearch: true
        doom_loop: true
mcp:
  # NOTE: ovav-budget, ovav-design-system, ovav-figma, ovav-git, ovav-sqlite
  # are declared but disabled — no binary exists yet in go-runtime/cmd/.
  # They will be enabled when their respective Go binaries are implemented.
  ovav-budget:
    enabled: false
  ovav-design-system:
    enabled: false
  ovav-figma:
    enabled: false
  ovav-git:
    enabled: false
  ovav-sqlite:
    enabled: false
  # Disabled: @modelcontextprotocol/server-fetch does not exist in npm.
  ovav-fetch:
    enabled: false
  # These Windows singletons are not available inside the active WSL2 runtime.
  # Keep them opt-in: a dead remote MCP endpoint blocks startup and resume.
  ovav-memory:
    type: remote
    url: http://127.0.0.1:8932/mcp
    enabled: false
  ovav-playwright:
    type: remote
    url: http://127.0.0.1:8931/mcp
    enabled: false
  # Atuin shell/history remains installed; its WSL MCP process is disabled.
  atuin:
    enabled: false
plugins:
- .opencode/plugins/ovav-monitor.js
- .opencode/plugins/ovav-atuin-bridge.js
providers:
  openai:
    options:
      timeout: 300000
  minimax-coding-plan:
    options:
      timeout: 300000
permissions:
  '*': allow
  edit: allow
  write: allow
  read: allow
  glob: allow
  grep: allow
  list: allow
  patch: allow
  task: allow
  skill: allow
  webfetch: allow
  websearch: allow
  doom_loop: allow
  invalid: allow
  question: allow
  todoread: allow
  todowrite: allow
  diff: allow
  bash:
    '*': allow
    'apt install *': deny
    'dd *of=/dev/*': deny
    'gh auth status*': allow
    'gh issue list*': allow
    'gh issue view*': allow
    'gh pr create*': allow
    'gh pr list*': allow
    'gh pr status*': allow
    'gh pr view*': allow
    'gh repo view*': allow
    'git add *': allow
    'git branch --delete *': deny
    'git branch --show-current': allow
    'git branch -D *': deny
    'git commit*': allow
    'git diff*': allow
    'git log*': allow
    'git ls-remote *': allow
    'git push*': deny
    'git remote -v': allow
    'git rev-parse*': allow
    'git status*': allow
    'go run -C go-runtime ./cmd/ovav validate*': allow
    'go run -C go-runtime ./internal/validators/cmd/validate*': allow
    'mkfs*': deny
    'npm install *': deny
    'npm run build*': allow
    'npm run lint*': allow
    'npm run test*': allow
    'npm run typecheck*': allow
    'npm test*': allow
    'pip install *': deny
    'pytest*': allow
    'python3 -m pytest*': allow
    'rm -rf /*': deny
    'sudo *': deny

  external_directory:
    '*': allow
