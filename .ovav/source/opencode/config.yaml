version: '1.0'
schema: https://opencode.ai/config.json
_ovav:
  policy: yolo-trusted-domain
  version: yolo-2026-08-13
  managed_by: .ovav/policy/permission_authority.json
  rationale: OVAV TRUSTED DOMAIN — host does not re-ask when OVAV governor decides.
  autonomous: true
  wildcard_global: true
runtime:
  model: openai/gpt-5.6-luna
  small_model: minimax-coding-plan/MiniMax-M3
  default_agent: Platform Engineering
  default_permission: allow
  instructions:
  - opencode_AGENTS.md
  agent:
    default:
      name: default
      description: OVAV default agent — delegates to Platform Engineering lead
      mode: primary
      prompt: '{file:/home/braka/Systems/ovav/.opencode/agents/area-platform-engineering.md}'
      tools:
        bash: true
        edit: true
        write: true
        read: true
        glob: true
        grep: true
        list: true
        patch: true
        task: true
        skill: true
        webfetch: true
        websearch: true
        doom_loop: true
mcp:
  # NOTE: ovav-budget, ovav-design-system, ovav-figma, ovav-git, ovav-sqlite
  # are declared but disabled — no binary exists yet in go-runtime/cmd/.
  # They will be enabled when their respective Go binaries are implemented.
  ovav-budget:
    enabled: false
  ovav-design-system:
    enabled: false
  ovav-figma:
    enabled: false
  ovav-git:
    enabled: false
  ovav-sqlite:
    enabled: false
  # Disabled: @modelcontextprotocol/server-fetch does not exist in npm.
  ovav-fetch:
    enabled: false
  # Windows singleton: supergateway + stateful memory MCP.
  ovav-memory:
    type: remote
    url: http://127.0.0.1:8932/mcp
    enabled: true
  # Windows singleton: Microsoft Playwright MCP with Windows Chrome.
  ovav-playwright:
    type: remote
    url: http://127.0.0.1:8931/mcp
    enabled: true
  # Atuin shell/history remains installed; its WSL MCP process is disabled.
  atuin:
    enabled: false
plugins:
- .opencode/plugins/ovav-monitor.js
- .opencode/plugins/ovav-atuin-bridge.js
providers:
  openai:
    options:
      timeout: 300000
  minimax-coding-plan:
    options:
      timeout: 300000
permissions:
  '*': allow
  edit: allow
  write: allow
  read: allow
  glob: allow
  grep: allow
  list: allow
  patch: allow
  task: allow
  skill: allow
  webfetch: allow
  websearch: allow
  doom_loop: allow
  invalid: allow
  question: allow
  todoread: allow
  todowrite: allow
  diff: allow
  bash:
    '*': allow

  external_directory:
