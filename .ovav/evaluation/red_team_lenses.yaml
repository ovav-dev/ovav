# Red Team Lenses — OVAV Adversarial Evaluation Policy
# Activated for complex+ task sizes.
# Each lens evaluates proposals from a distinct adversarial perspective.
#
# Gate rule: attacker or maintainer FAIL → cannot pass directly.

version: "1.0.0"
canonical: true
updated_at: 2026-06-21
updated_by: thavren

activation:
  task_sizes: [complex, critical]
  auto_trigger: true
  gate_blocking_lenses: [attacker, maintainer]

lenses:
  builder:
    question: "Can this be built simply and safely?"
    weight: 1.0
    pass_threshold: 0.6
    description: >
      Evaluates build simplicity, blocked surface awareness, and file count.
      Large changes (>10 files) without splitting reduce score.
      No expected_files declaration is a concern.

  reviewer:
    question: "What would break in code review?"
    weight: 1.0
    pass_threshold: 0.6
    description: >
      Evaluates harness coverage, evidence requirements, and schema validation.
      Touched schemas without validators reduce score.
      Missing test fixtures are flagged.

  attacker:
    question: "How could this be abused?"
    weight: 1.5
    pass_threshold: 0.6
    description: >
      Critical lens — evaluates security surface risk.
      AGENTS.md tampering, permission_authority changes, and policy surface
      modifications without drift checkers are high-severity flags.
      High/critical risk without rollback capability is a blocking concern.

  maintainer:
    question: "Will this remain clear in 6 months?"
    weight: 1.5
    pass_threshold: 0.6
    description: >
      Critical lens — evaluates long-term maintainability.
      Flags undocumented decisions, magic numbers, implicit conventions,
      and missing rationale for architectural choices.

  user:
    question: "Does this feel useful and understandable?"
    weight: 0.8
    pass_threshold: 0.6
    description: >
      User-facing lens — evaluates UX impact.
      Internal changes auto-pass. User-visible changes require evidence.
      Friction reduction is a positive signal.

scheduling:
  mode: dual
  methods:
    - type: push_trigger
      description: "Runs on push to main/develop when touching agent profiles, laws, contracts, or validators"
      branches: [main, develop]
      paths:
        - "ovav/agents/**"
        - ".ovav/laws/**"
        - ".ovav/service_areas/shared/**"
        - "go-runtime/internal/validators/red_team_audit.go"
    - type: local_cron
      description: "Weekly local audit via system crontab or manual trigger"
      schedule: "Weekly, Monday 08:00 UTC-5"
      script: "python3 tools/harnesses/red_team_lens_evaluator.py --json"
      fallback: |
        Since OVAV migrated from GitHub to Codeberg, GitHub Actions no longer execute.
        Use local crontab: `0 8 * * 1 cd /home/braka/Systems/OVAV && ./tools/harnesses/run_red_team_audit.sh`
    - type: manual
      description: "On-demand via: go run ./go-runtime/cmd/ovav/ validate --id red_team_audit"

migration_note: |
  GitHub Actions workflow (.github/workflows/red-team-cron.yml) was the original
  automation mechanism (weekly cron + push triggers). After migration to Codeberg,
  this no longer executes. The 4 existing reports were all from push triggers on GitHub
  before migration. Local alternatives documented above.
