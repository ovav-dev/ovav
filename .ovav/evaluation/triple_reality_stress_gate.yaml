# OVAV Triple Reality Stress Gate — Policy
# Generated by: Thavren / OVAV Platform Engineering — Phase 2
# Canonical source: docs/lab/OVAV_LIVING_INTELLIGENCE_EVALUATION_LAYER_THAVREN.md (Section 6)
# Purpose: Política ejecutable del stress gate. Define activación, reglas de decisión y ciclos de rediseño.

schema: triple_reality_stress_gate_policy.v1
generated_at: "2026-05-29T21:00:00Z"

# ── Activation ───────────────────────────────────────────────────────────────

activation:
  by_task_size:
    micro:
      scenarios_required: 0
      gate_active: false
    simple:
      scenarios_required: 1
      gate_active: true
      scenarios: [SCENARIO-01]
    medium:
      scenarios_required: 3
      gate_active: true
      scenarios: [SCENARIO-01, SCENARIO-02, SCENARIO-03]
    complex:
      scenarios_required: 3
      gate_active: true
      scenarios: [SCENARIO-01, SCENARIO-02, SCENARIO-03]
      red_team_required: true
    critical:
      scenarios_required: 3
      gate_active: true
      scenarios: [SCENARIO-01, SCENARIO-02, SCENARIO-03]
      red_team_required: true
      approval_required: true

# ── Decision rules ───────────────────────────────────────────────────────────

decision_rules:
  pass_condition:
    description: "Todos los escenarios aplicables deben resultar PASS"
    rule: "all(scenario.result == PASS for scenario in activated_scenarios)"

  pass_with_changes_condition:
    description: "Al menos un escenario requiere cambios pero ninguno falla"
    rule: "any(scenario.result == CHANGES_REQUIRED) and none(scenario.result == FAIL)"

  fail_condition:
    description: "Al menos un escenario resulta FAIL"
    rule: "any(scenario.result == FAIL)"

  blocked_condition:
    description: "Escenario crítico falla o se exceden 2 ciclos de rediseño"
    rule: "any(scenario.result == FAIL and scenario.severity == critical) or redesign_cycles > 2"

redesign_policy:
  max_cycles: 2
  description: >
    Si una propuesta falla, Thavren debe moldearla máximo 2 ciclos.
    Si sigue fallando después de 2 ciclos, se archiva como inmadura o bloqueada.
  cycle_tracking:
    field: redesign_cycles
    storage: decision_packet.redesign_cycles
  archive_action:
    status: archived_as_immature
    reason: "Propuesta excedió 2 ciclos de rediseño sin pasar el stress gate"

# ── Failure mode severity weights ────────────────────────────────────────────

severity_weights:
  critical: 1.0    # Bloquea si no está mitigado
  high: 0.8        # Requiere mitigación explícita
  medium: 0.5      # Requiere plan de mitigación
  low: 0.2         # Se registra, no bloquea

mitigation_requirement:
  critical: "Mitigación implementada y verificada"
  high: "Mitigación documentada en el packet"
  medium: "Plan de mitigación documentado"
  low: "Registrado en risk_log"

# ── Integration points ───────────────────────────────────────────────────────

integration:
  decision_packet:
    input: "Decision packet validado (PASS o PASS_WITH_CHANGES)"
    output: "Stress evaluation agregada al decision packet"

  red_team_lens:
    activation: "complex y critical"
    input: "Stress evaluation + decision packet"
    output: "Red team lens evaluation"

  law_evaluation:
    referenced_laws:
      - "LAW-20: adversarial_future_stress"

  evidence_pipeline:
    produces:
      - "stress_evaluation_report.json"
      - "scenario_trace.yaml"
    consumes:
      - "scenario_bank.yaml"
      - "decision_packet"

# ── Blocked surfaces (consistent with source-local policy) ───────────────────

blocked_surfaces:
  - "No ejecución real de escenarios en producción"
  - "No modificación de archivos del sistema durante stress test"
  - "No acceso a ~/.config, ~/.local o paths externos"
  - "Stress evaluation es diseño-tiempo: evalúa el packet, no ejecuta la implementación"
