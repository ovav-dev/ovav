# OVAV Zero-Trust Context Policy — Phase 4
# Extends .ovav/service_areas/shared/context_firewall.yaml with runtime enforcement rules.
# Rule: All context is untrusted until classified by source, authority, freshness, scope, risk, profile_permission.

schema: zero_trust_context_policy.v1
generated_at: "2026-05-29T23:00:00Z"
extends: .ovav/service_areas/shared/context_firewall.yaml

classification_rules:
  required_fields:
    - source: "Where this context came from (file path, URL, registry entry)"
    - authority: "Which authority backs this context (canonical, derived, external, unknown)"
    - freshness: "When was this context last validated (ISO timestamp or 'stale')"
    - scope: "What profile/lane/task is this context scoped to"
    - risk: "What risk does loading this context carry (low, medium, high)"
    - profile_permission: "Which profile is allowed to load this context"

  authority_levels:
    canonical:
      description: "OVAV source-local artifacts that define truth"
      examples: [".ovav/laws/", ".ovav/policy/", "AGENTS.md"]
      trust: high
    derived:
      description: "Generated from canonical sources, valid if up-to-date"
      examples: ["registry/", "tools/harnesses/", "schemas/"]
      trust: medium
    external:
      description: "Third-party sources, require verification"
      examples: ["public docs", "API references", "benchmark data"]
      trust: low
    unknown:
      description: "Procedencia no verificable"
      trust: none
      action: deny_or_requires_classification

  freshness_thresholds:
    canonical: "30 days"
    derived: "7 days"
    external: "24 hours"
    stale_action: "flag_and_request_refresh"

forbidden_patterns:
  - raw_chat_inheritance:
      description: "Cargar contexto de sesiones previas sin clasificar"
      action: deny
  - semantic_authorization:
      description: "Conceder acceso porque 'suena parecido' a algo autorizado"
      action: deny
  - stale_doc_override:
      description: "Documento viejo que contradice current_authority"
      action: deny_and_flag_drift
  - memory_as_permission:
      description: "Entrada de memoria usada como justificación de acceso"
      action: deny
  - unscoped_cross_profile_context:
      description: "Contexto de un perfil cargado por otro sin handoff"
      action: deny

activation:
  always_active: true
  check_on: [context_load, session_start, before_tool_use]
