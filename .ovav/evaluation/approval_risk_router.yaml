# OVAV Approval Risk Router — Policy — Phase 10
# Generated by: Thavren / OVAV Platform Engineering
# Canonical source: docs/lab/OVAV_LIVING_INTELLIGENCE_EVALUATION_LAYER_THAVREN.md (Section 14)
# Purpose: Enruta cada acción propuesta al nivel de aprobación requerido según su riesgo.
# Rule: Toda acción gated write, mutation o irreversible debe pasar por este router.

schema: approval_risk_router.v1
generated_at: "2026-05-30T07:10:00Z"
canonical_source: docs/lab/OVAV_LIVING_INTELLIGENCE_EVALUATION_LAYER_THAVREN.md

# ── Risk levels and routing ──────────────────────────────────────────────────

risk_levels:
  low:
    action: automatic
    description: >
      Acciones de bajo riesgo: lecturas, verificaciones, inspecciones,
      reportes, diagnósticos. No requieren intervención humana.
    examples:
      - read-only file access
      - git status, git log
      - harness validation runs
      - evidence generation
      - artifact reading
    evidence_required: false
    approval_chain: []

  medium:
    action: automatic_with_evidence
    description: >
      Acciones de riesgo medio: ediciones source-local, creación de archivos
      dentro del repo, stage de cambios. Se ejecutan automáticamente pero
      requieren evidencia post-ejecución (trace, log, diff).
    examples:
      - file edits within repo
      - new file creation (non-policy)
      - git add, git stage
      - registry updates
      - schema additions
    evidence_required: true
    evidence_types:
      - git_diff_summary
      - harness_pass_report
      - schema_validation_log
    approval_chain: []

  high:
    action: human_confirmation
    description: >
      Acciones de alto riesgo: modificaciones de política, cambios en
      permission_authority.json, modificaciones en AGENTS.md, alteraciones
      en blocked surfaces, git commit, git push.
    examples:
      - policy file modifications
      - permission_authority.json changes
      - AGENTS.md modifications
      - blocked surface boundary changes
      - git commit, git push
      - capability lifecycle transitions
    evidence_required: true
    evidence_types:
      - full_diff
      - workspace_safety_gate_pass
      - protected_branch_check
      - permission_drift_check
    approval_chain:
      - user_confirmation
    requires_waiver: false

  critical:
    action: maintainer_or_founder_gate
    description: >
      Acciones críticas: cambios en integridad del sistema (OVAV_INTEGRITY_SEAL),
      operaciones sobre ramas protegidas, modificaciones de leyes OVAV,
      cambios en el runtime enforcement, alteraciones en el capability
      lifecycle de capacidades full_active.
    examples:
      - OVAV_INTEGRITY_SEAL modifications
      - protected branch writes (main, master, develop)
      - OVAV law modifications
      - runtime enforcement changes
      - capability retirement (full_active → deprecated)
    evidence_required: true
    evidence_types:
      - full_diff_with_rationale
      - decision_packet_approved
      - triple_reality_stress_pass
      - red_team_lens_pass
      - protected_branch_waiver (si aplica)
    approval_chain:
      - workspace_safety_gate
      - user_confirmation
      - ceo_waiver_if_protected
    requires_waiver: true

  irreversible:
    action: backup_approval_rollback_required
    description: >
      Acciones irreversibles: force-push, branch deletion, squash sin backup,
      eliminación de artifacts canónicos, modificaciones que no pueden
      deshacerse con git revert.
    examples:
      - git push --force
      - branch deletion
      - history rewriting
      - canonical artifact deletion
      - squash merge sin backup
    evidence_required: true
    evidence_types:
      - full_backup_created
      - rollback_plan_documented
      - decision_packet_approved
      - triple_reality_stress_pass
      - red_team_lens_pass
      - ceo_waiver
    approval_chain:
      - backup_created
      - rollback_plan_verified
      - user_confirmation
      - maintainer_approval
    requires_waiver: true
    requires_backup: true
    requires_rollback_plan: true

# ── Routing rules ───────────────────────────────────────────────────────────

routing_rules:
  # How to classify an action into a risk level
  classification:
    by_surface:
      - surface: "read, verify, inspect, diagnose, report, status, sync"
        default_risk: low
      - surface: "edit, create, stage, registry_update, schema_add"
        default_risk: medium
      - surface: "policy_write, permission_change, git_commit, git_push, lifecycle_transition"
        default_risk: high
      - surface: "integrity_seal, protected_branch_mutate, law_change, runtime_enforcement, capability_retire"
        default_risk: critical
      - surface: "force_push, branch_delete, history_rewrite, canonical_delete, squash_no_backup"
        default_risk: irreversible

    by_path:
      - pattern: ".ovav/policy/**"
        escalate_to: high
        reason: "policy files govern system behavior"
      - pattern: ".ovav/laws/**"
        escalate_to: critical
        reason: "OVAV laws are foundational"
      - pattern: "AGENTS.md"
        escalate_to: high
        reason: "AGENTS.md contains integrity seal and core directives"
      - pattern: "OVAV_INTEGRITY_SEAL"
        escalate_to: critical
        reason: "integrity seal tampering is critical"
      - pattern: "tools/validators/**"
        escalate_to: medium
        reason: "validators enforce runtime behavior"
      - pattern: "registry/**"
        escalate_to: medium
        reason: "registries are derived from canonical sources"
      - pattern: "schemas/**"
        escalate_to: medium
        reason: "schemas validate artifacts"

  # How to escalate when multiple rules conflict
  escalation:
    rule: "highest_wins"
    description: >
      Si una acción toca múltiples superficies o paths con diferentes
      niveles de riesgo, el nivel más alto prevalece.

  # Integration with capability lifecycle
  capability_integration:
    description: >
      Para capabilities en capability_registry.yaml, el risk level de la
      capability se usa como base. Las transiciones de estado escalan
      automáticamente:
        - idea → spec: low (solo documentación)
        - spec → sandbox: medium (pruebas aisladas)
        - sandbox → read_only: medium (verificación)
        - read_only → gated_write: high (mutation gates)
        - gated_write → limited_active: high (activación parcial)
        - limited_active → full_active: critical (activación total)
        - any → deprecated: critical (impacto sistémico)
        - deprecated → retired: critical (eliminación)

# ── Decision matrix ─────────────────────────────────────────────────────────

decision_matrix:
  # Maps (surface_risk, path_escalation_risk) → final action
  # Uses the highest_wins rule
  #
  # Example: editing a file in .ovav/policy/ → medium (edit) escalated
  #   to high (policy path) → final: high → human_confirmation

  # Quick reference table (highest_wins applied):
  escalated_actions:
    low_always: automatic
    medium_max: automatic_with_evidence
    high_always: human_confirmation
    critical_always: maintainer_or_founder_gate
    irreversible_always: backup_approval_rollback_required

# ── Integration points ──────────────────────────────────────────────────────

integration:
  workspace_safety_gate:
    description: "workspace_safety_gate.py invoca el router antes de writes"
    hook: pre_mutation

  protected_branch:
    description: "check_protected_branch.py usa el router para ramas protegidas"
    hook: pre_write_on_protected

  capability_lifecycle:
    description: "capability_lifecycle_gate.py consulta el router para transiciones"
    hook: pre_transition

  evidence_pipeline:
    produces:
      - approval_router_trace.yaml
    consumes:
      - workspace_safety_gate_result
      - protected_branch_check_result
