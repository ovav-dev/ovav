# OVAV Boring Path First — Policy — Section 16
# Generated by: Thavren / OVAV Platform Engineering
# Canonical source: docs/lab/OVAV_LIVING_INTELLIGENCE_EVALUATION_LAYER_THAVREN.md (Section 16)
# Purpose: Enforce progressive activation sequence. Every action escalates through
#   read_only → dry_run → preview → sandbox → scoped_write → rollback_ready → apply.
# Rule: Ninguna operación mutativa salta directamente a scoped_write o apply sin pasar
#   por los estados previos.

schema: boring_path_first.v1
generated_at: "2026-05-30T07:30:00Z"
canonical_source: docs/lab/OVAV_LIVING_INTELLIGENCE_EVALUATION_LAYER_THAVREN.md

# ── Progressive sequence ────────────────────────────────────────────────────

sequence:
  - step: read_only
    order: 1
    description: "Solo lectura. Verificar, inspeccionar, diagnosticar, leer estado."
    allowed_operations:
      - file_read
      - git_status
      - git_log
      - git_diff
      - validation_run
      - evidence_read
      - artifact_inspect
    blocked_operations:
      - file_write
      - file_edit
      - git_add
      - git_commit
      - git_push
    gate_to_next: "read_verification_complete"

  - step: dry_run
    order: 2
    description: "Simulación sin efectos laterales. Preview de cambios, diff hipotético."
    allowed_operations:
      - all_from_previous
      - dry_run_script
      - preview_diff
      - schema_validate_dry
      - harness_dry_run
      - lint_check
    blocked_operations:
      - file_write
      - file_edit
      - git_add
      - git_commit
    gate_to_next: "dry_run_passed"

  - step: preview
    order: 3
    description: "Vista previa detallada. Mostrar qué archivos cambiarán, diff completo."
    allowed_operations:
      - all_from_previous
      - full_diff_preview
      - change_summary
      - impact_analysis
      - dependency_check
    blocked_operations:
      - file_write
      - file_edit
      - git_add
    gate_to_next: "preview_approved"

  - step: sandbox
    order: 4
    description: "Pruebas aisladas. Ejecutar en sandbox sin afectar el estado real."
    allowed_operations:
      - all_from_previous
      - sandbox_execution
      - test_run_isolated
      - schema_validation
      - harness_run_isolated
      - fixture_test
    blocked_operations:
      - file_write_to_repo
      - git_add
      - git_commit
    gate_to_next: "sandbox_tests_pass"

  - step: scoped_write
    order: 5
    description: "Escritura acotada. Solo los archivos declarados, con rollback plan."
    allowed_operations:
      - all_from_previous
      - file_write_scoped
      - file_edit_scoped
      - file_create_scoped
      - git_add
      - git_stage
    blocked_operations:
      - global_write
      - config_write
      - plugin_install
      - git_commit (sin approval)
      - git_push (sin approval)
    gate_to_next: "scoped_write_verified"
    requires: ["file_manifest", "rollback_plan"]

  - step: rollback_ready
    order: 6
    description: "Plan de rollback verificado. Capacidad de deshacer confirmada."
    allowed_operations:
      - all_from_previous
      - rollback_plan_verify
      - backup_create
      - git_commit (con approval)
    blocked_operations:
      - git_push (sin approval)
      - force_push
      - history_rewrite
    gate_to_next: "rollback_plan_verified"
    requires: ["rollback_plan", "backup_created", "approval_gate"]

  - step: apply
    order: 7
    description: "Aplicación final. Cambios consolidados y verificados."
    allowed_operations:
      - all_from_previous
      - git_push
      - evidence_generation
      - registry_update
    blocked_operations:
      - force_push
      - branch_delete
      - history_rewrite
    requires: ["all_gates_passed", "evidence_complete"]

# ── Domain-specific boring paths ────────────────────────────────────────────

domains:
  package_install:
    description: "Instalación de paquetes requiere verificación progresiva"
    sequence:
      - dry_run:
          action: "Verificar dependencias sin instalar"
          tool: "pip install --dry-run / npm install --dry-run"
      - quarantine:
          action: "Instalar en entorno aislado primero"
          tool: "virtualenv / container"
      - provenance_check:
          action: "Verificar origen y checksums"
          tool: "pip hash / npm audit / checksum verify"
      - approval:
          action: "Aprobación explícita para instalar"
          gate: "user_confirmation"

  mcp_tool:
    description: "Herramientas MCP requieren validación progresiva"
    sequence:
      - read_only:
          action: "Solo capacidades de lectura expuestas"
          gate: "capability_manifest_check"
      - gated_write:
          action: "Escritura con gates y scope limitado"
          gate: "permission_authority_check"

  memory:
    description: "Operaciones de memoria requieren progresión cautelosa"
    sequence:
      - read_probe:
          action: "Probar lectura sin modificar"
          gate: "memory_firewall_check"
      - redacted_append:
          action: "Añadir con datos redactados, sin leer contexto completo"
          gate: "redaction_policy_check"
      - scoped_recall:
          action: "Recuperar solo lo necesario para la tarea"
          gate: "context_economy_check"

  permission_change:
    description: "Cambios de permisos requieren verificación máxima"
    sequence:
      - audit_current:
          action: "Auditar permisos actuales"
          gate: "permission_audit"
      - propose_change:
          action: "Proponer cambio con rationale"
          gate: "decision_packet"
      - stress_test:
          action: "Evaluar con Triple Reality Stress Gate"
          gate: "stress_gate_pass"
      - approval:
          action: "Aprobación de maintainer"
          gate: "maintainer_approval"

  capability_lifecycle_transition:
    description: "Transiciones de ciclo de vida requieren boring path"
    sequence:
      - validate_current:
          action: "Validar estado actual y gates cumplidos"
          gate: "lifecycle_gate"
      - dry_run_transition:
          action: "Simular transición"
          gate: "transition_dry_run"
      - approval_risk_route:
          action: "Enrutar por nivel de riesgo"
          gate: "approval_risk_router"
      - apply_transition:
          action: "Aplicar transición con evidencia"
          gate: "transition_applied"

# ── Enforcement ─────────────────────────────────────────────────────────────

enforcement:
  default_mode: strict
  description: >
    En modo strict, cualquier operación que intente saltar pasos de la secuencia
    es bloqueada. Para tareas micro (< 3 archivos, sin policy) se permite
    ir directo a scoped_write con workspace_safety_gate.
  
  exceptions:
    micro_task:
      max_files: 3
      skip_to: scoped_write
      requires: ["workspace_safety_gate", "file_manifest"]
      blocked_surfaces_still_blocked: true

  integration:
    workspace_safety_gate:
      hook: "pre_scoped_write"
      check: "boring_path_step >= 5"
    approval_risk_router:
      hook: "pre_apply"
      check: "boring_path_complete AND risk_approved"
    capability_lifecycle:
      hook: "pre_transition"
      check: "domain_boring_path_satisfied"

# ── Blocked bypass attempts ────────────────────────────────────────────────

blocked_bypass:
  - pattern: "Direct scoped_write without read_only/dry_run"
    action: deny
    message: "Boring Path First: must pass read_only → dry_run → preview → sandbox first"
  - pattern: "Direct apply without rollback_ready"
    action: deny
    message: "Boring Path First: rollback_ready required before apply"
  - pattern: "Force push bypassing all gates"
    action: deny
    message: "Boring Path First: force push is irreversible — blocked at all steps"
