version: "1.0.0"

validators:
  validate_registries:
    module: tools.validators.validate_registries
    function: validate
    tier: 10
    surface: registry/
    blocking: true

  validate_service_profiles:
    module: tools.validators.validate_service_profiles
    function: validate
    tier: 10
    surface: registry/
    blocking: true

  validate_harnesses:
    module: tools.validators.validate_harnesses
    function: validate
    tier: 10
    surface: registry/
    blocking: true

  validate_skills:
    module: tools.validators.validate_skills
    function: validate
    tier: 10
    surface: registry/
    blocking: true

  validate_phase_dag:
    module: tools.validators.validate_phase_dag
    function: validate
    tier: 10
    surface: registry/
    blocking: true

  validate_memory_policy:
    module: tools.validators.validate_memory_policy
    function: validate
    tier: 10
    surface: registry/
    blocking: true

  validate_model_policy:
    module: tools.validators.validate_model_policy
    function: validate
    tier: 10
    surface: .opencode/
    blocking: true

  validate_result_contracts:
    module: tools.validators.validate_result_contracts
    function: validate
    tier: 10
    surface: registry/
    blocking: true

  validate_workspace_safety_gate:
    module: tools.validators.check_workspace_safety_gate
    function: validate
    tier: 10
    triggers: [on_user_message, before_implementation, before_apply, before_git_stage, before_git_push]
    blocking: true

  validate_git_push_gate:
    module: tools.validators.check_git_push_gate
    function: validate
    tier: 10
    triggers: [after_git_stage]
    blocking: true

  validate_permission_policy_drift:
    module: tools.validators.check_permission_policy_drift
    function: validate
    tier: 10
    surface: .ovav/policy/
    blocking: true

  validate_host_config_drift:
    module: tools.validators.check_host_config_drift
    function: validate
    tier: 10
    triggers: [on_session_start]
    blocking: true

  validate_canonical_integrity:
    module: tools.validators.check_canonical_integrity
    function: validate
    tier: 10
    triggers: [before_implementation]
    blocking: true

  validate_ledger_write_path:
    module: tools.validators.check_ledger_write_path
    function: validate
    tier: 10
    triggers: [before_implementation]
    blocking: true

  validate_validator_coverage:
    module: tools.validators.check_validator_coverage
    function: validate
    tier: 9
    triggers: [before_implementation]
    blocking: false

  validate_registry_drift:
    module: tools.validators.check_registry_drift
    function: validate
    tier: 9
    triggers: [before_implementation]
    blocking: true

  validate_contract_freshness:
    module: tools.validators.check_contract_freshness
    function: validate
    tier: 9
    triggers: [before_implementation]
    blocking: true

  validate_handoff_sync:
    module: tools.validators.check_handoff_sync
    function: validate
    tier: 9
    triggers: [before_close, on_session_start]
    blocking: true

  validate_config_syntax:
    module: tools.validators.check_config_syntax
    function: validate
    tier: 10
    triggers: [before_implementation]
    blocking: true

  validate_todo_debt:
    module: tools.validators.check_todo_debt
    function: validate
    tier: 8
    blocking: false

  validate_behavioral_directives:
    module: tools.validators.check_behavioral_directives
    function: validate
    tier: 10
    triggers: [on_session_start, on_user_message]
    blocking: true

  validate_gate_self_protection:
    module: tools.security.gate_self_protection
    function: validate
    tier: 10
    triggers: [on_session_start]
    blocking: true

  validate_head_integrity:
    module: tools.security.head_integrity_verifier
    function: validate
    tier: 10
    triggers: [on_session_start]
    blocking: true

  validate_session_context_guard:
    module: tools.security.session_context_guard
    function: validate
    tier: 10
    triggers: [on_session_start]
    blocking: true

harnesses:
  check_poison_guard_hardening:
    module: tools.harnesses.check_poison_guard_hardening
    function: main
    tier: 9
    triggers: [on_session_start, before_implementation]
    manual_command: python3 tools/harnesses/check_poison_guard_hardening.py

  check_delegation_runtime:
    module: tools.harnesses.check_delegation_runtime
    function: main
    tier: 10
    triggers: [before_implementation]
    manual_command: python3 tools/harnesses/check_delegation_runtime.py

  check_invalid_fixtures:
    module: tools.validators.check_invalid_fixtures
    function: main
    tier: 9
    triggers: [before_implementation]
    manual_command: python3 tools/validators/check_invalid_fixtures.py

tools:
  ovav_validate:
    command: python3 tools/ovav_runtime.py validate
    alias: validate
    category: system
    risk: low

  ovav_validate_all:
    command: python3 tools/validators/validate_all.py
    alias: validate-all
    category: system
    risk: low

  ovav_doctor:
    command: python3 tools/ovav_runtime.py context --next
    alias: doctor
    category: system
    risk: low

  project_agents:
    command: python3 tools/agents/project_opencode.py
    alias: project
    category: projection
    risk: low

  project_visual:
    command: python3 tools/visual/project_opencode_visual.py
    alias: project-visual
    category: projection
    risk: low

  release_pipeline:
    command: python3 .ovav/forge/pipeline.py
    alias: release
    category: release
    risk: medium

adapters:
  opencode_agents:
    module: .ovav.forge.adapters.opencode.agents
    target_client: opencode
    surface: agents

  opencode_skills:
    module: .ovav.forge.adapters.opencode.skills
    target_client: opencode
    surface: skills

  opencode_visual:
    module: .ovav.forge.adapters.opencode.visual
    target_client: opencode
    surface: themes

plugins:
  ovav_tui:
    source_dir: .ovav/source/plugins/opencode/tui
    target_client: opencode
    plugin_type: tui

  ovav_monitor:
    source_dir: .ovav/source/plugins/opencode/monitor
    target_client: opencode
    plugin_type: monitor

  ovav_status:
    source_dir: .ovav/source/plugins/opencode/status
    target_client: opencode
    plugin_type: status
