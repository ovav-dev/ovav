# OVAV Connector Bus — Clients
# ==================================
# Tipo de slot: client (nuevo)
# Clientes externos a los que OVAV proyecta assets.
#
# CONECTAR:   1 entry acá + forge/targets/<client>.yaml + clients/<client>/
# DESCONECTAR: borrar entry + rm -rf clients/<client>/
#
# ✅ ACTIVE — 2 clients projected (OpenCode, Claude Code).
# ⏳ PENDING — VS Code and PI harness not yet implemented (stubs exist).

version: "1.0.0"
slot_type: client
description: "Clientes externos — proyección de assets OVAV a IDEs/CLIs"

components:

  opencode:
    target_dir: clients/opencode
    symlink: .opencode → clients/opencode
    projection_root: clients/opencode
    status: active
    labels: [cli, ai-assistant, active]
    forge_target: .ovav/forge/targets/opencode.yaml

  claude_code:
    target_dir: clients/claude-code
    projection_root: .claude
    status: active
    labels: [ide, ai-assistant, active]
    forge_target: .ovav/forge/targets/claude-code.yaml

  vscode:
    target_dir: clients/vscode
    projection_root: .vscode
    status: pending
    labels: [ide, extension, pending]
    forge_target: .ovav/forge/targets/vscode.yaml

  pi:
    target_dir: clients/pi
    projection_root: .pi
    status: pending
    labels: [personal-ai, pending]
    forge_target: .ovav/forge/targets/pi.yaml
