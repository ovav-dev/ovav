# OVAV Connector Bus — Plugins
# ==================================
# Tipo de slot: plugin
# Plugins de interfaz (TUI, monitor, status, theme) para clientes.
#
# CONECTAR:   1 entry + source_dir existente
# DESCONECTAR: borrar entry
#
# Schema: slots.yaml → slot_types.plugin

version: "1.0.0"
slot_type: plugin
description: "Plugins de UI/extensión para clientes externos"

components:

  ovav_tui:
    source_dir: .ovav/source/plugins/opencode/tui
    target_client: opencode
    plugin_type: tui
    labels: [tui, interface, dashboard]

  ovav_theme:
    source_dir: .ovav/visual/theme
    target_client: opencode
    plugin_type: theme
    labels: [theme, visual, branding]

  # ── MiMo Code native plugins ──────────────────────────────────────────
  # NOTE: ovav_monitor and ovav_status are BUILT-IN to MiMo Code.
  # Do NOT register them here — they duplicate native functionality.
  # Only register plugins that ADD value beyond MiMo Code's built-ins.

  ovav_governance:
    source_dir: .ovav/source/plugins/mimocode/governance
    target_client: mimocode
    plugin_type: governance
    labels: [governance, validation, runtime]
    active: true

  ovav_security:
    source_dir: .ovav/source/plugins/mimocode/security
    target_client: mimocode
    plugin_type: security
    labels: [security, hooks, audit]
    active: true
