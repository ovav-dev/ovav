# ── POST-SPLIT STRUCTURE ──────────────────────────────────────────────────────

post_split:
  ovav_core:
    go_module: "github.com/ovav/core"
    directories:
      - ".ovav/"                    # governance (canonical)
      - "cmd/ovav-dev/"             # developer CLI
      - "cmd/cpanel/"               # HTTP server + sync module
      - "internal/validators/"      # 77 validators
      - "internal/license/"         # server-side license (signing)
      - "tools/"                    # Python legacy
      - "docs/"                     # documentation
    go_mod_require:
      - "github.com/ovav/shared v0.1.0"

  ovav_product:
    go_module: "github.com/ovav/product"
    directories:
      - "cmd/cockpit/"              # TUI
      - "cmd/ovav/"                 # user CLI
      - "internal/ows/"             # Workflow System
      - "internal/gitflow/"         # Git operations
      - "internal/license/"         # client-side (verify only)
      - "internal/vault/"           # encryption
      - "internal/chronos/"
      - "internal/doctor/"
      - "internal/economy/"
      - "internal/profile/"
      - "internal/project/"
      - "internal/status/"
      - "internal/tailor/"
      - "internal/tools/"
      - "internal/config/"
      - "internal/plugins/"         # 🆕 plugin system
      - "internal/connect/"         # 🆕 OAuth connect
      - "internal/update/"          # 🆕 auto-update client
    go_mod_require:
      - "github.com/ovav/shared v0.1.0"

  ovav_shared:
    go_module: "github.com/ovav/shared"
    directories:
      - "format/"                   # output formatting
      - "install_contract/"         # VerificationResult types
      - "sbom_types/"               # SBOMData, ScanResult
      - "vault_crypto/"             # Encryptor interface
      - "git_operations/"           # GitRepo interface
      - "agent_formats/"            # ConvertFunc, format defs
