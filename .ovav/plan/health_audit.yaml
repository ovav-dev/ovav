        - Calcule TDEE, macros, distribución de comidas
        - Genere plan semanal con rotación de alimentos
        - Valide restricciones alimentarias contra recetas
        - Produzca lista de compras
      comparison: "Education tiene curriculum_engine (550 loc) que compone learning paths desde gaps."
      impact: "Los planes nutricionales son artesanales, no escalables, sin validación automatizada."
      fix: "Implementar nutrition_planner.py: TDEE calculator → macro splitter → meal composer → shopping list generator."
      estimated_effort: "8-12 días"
      deps: ["Eidren (food database evidence)", "Antonio (meal templates)"]

    - id: GAP-H4
      name: "Sin exercise program designer"
      severity: "HIGH"
      description: >
        No existe herramienta para diseñar programas de entrenamiento periodizados.
