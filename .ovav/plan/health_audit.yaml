# 7. TOOL ROADMAP (equivalente a Education prioritization)
# ═══════════════════════════════════════════════════════════════════════════

tool_roadmap:
  context: >
    El área Health tiene 0 herramientas hoy. Se proponen 6 herramientas
    core en orden de dependencia. La primera (patient_intake) es la puerta
    de entrada — sin datos del paciente, nada más funciona.

  tools:
    - rank: 1
      tool: "patient_intake.py"
      why_first: >
        Es la puerta de entrada. Sin ficha de paciente estructurada, no hay
        plan posible. Además aplica CRIT-R08 (red flags → derivación) y
        CRIT-R03 (individualización). Fátima lidera por su expertise en
        métricas y evaluación.
      dependency_of: ["nutrition_planner", "exercise_designer", "supplement_checker"]
      estimated_days: 5
      squad: "Fátima + Renata"

    - rank: 2
      tool: "nutrition_planner.py"
      why_first: >
        Segundo porque consume los datos del patient_intake. Es el corazón
        del área: transforma métricas y preferencias en un plan nutricional
        accionable. Rubén lidera con su expertise en periodización nutricional.
        Antonio aporta las plantillas de comidas y recetas.
      dependency_of: ["meal_prep_generator"]
      estimated_days: 10
      squad: "Rubén + Antonio"

    - rank: 3
      tool: "exercise_designer.py"
      why_first: >
        Tercero porque también consume patient_intake y puede construirse en
        paralelo con nutrition_planner. Silvia lidera con su expertise en
        fisiología del ejercicio y periodización. Luna aporta la integración
        de recuperación y carga de entrenamiento.
      dependency_of: ["recovery_monitor"]
      estimated_days: 10
      squad: "Silvia + Luna"
      note: "Puede ejecutarse en paralelo con nutrition_planner."

    - rank: 4
      tool: "supplement_checker.py"
      why_first: >
        Cuarto porque complementa nutrition_planner. Valida que los suplementos
        recomendados tengan evidencia, no interactúen negativamente, y sean
        apropiados para el perfil del paciente. León lidera, Marina verifica
        la evidencia clínica.
      dependency_of: []
      estimated_days: 7
      squad: "León + Marina"

    - rank: 5
      tool: "recovery_monitor.py"
      why_first: >
        Quinto porque cierra el ciclo de feedback: ¿está funcionando el plan
        combinado (nutrición + ejercicio)? Monitorea HRV, calidad de sueño,
        RPE, biomarcadores de sobreentrenamiento. Luna lidera.
      dependency_of: []
      estimated_days: 7
      squad: "Luna + Fátima"
      note: "Requiere datos de seguimiento del paciente (sleep trackers, HRV, RPE logs)."

    - rank: 6
      tool: "mental_performance_coach.py"
      why_first: >
        Sexto porque aborda la capa psicológica del rendimiento. Bruno lidera
        con protocolos de mindfulness, manejo de ansiedad competitiva, y
        construcción de mentalidad de crecimiento. Puede ejecutarse en
        paralelo con recovery_monitor.
      dependency_of: []
      estimated_days: 5
      squad: "Bruno"
      note: "Herramienta de apoyo, no bloqueante para el pipeline principal."

  decision_summary: >
    patient_intake → [nutrition_planner ∥ exercise_designer] → supplement_checker
    → recovery_monitor ∥ mental_performance_coach (paralelo al final)

