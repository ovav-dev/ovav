    - id: GAP-H1
      name: "0 herramientas de dominio — área sin tooling"
      severity: "HIGH"
      description: >
        A diferencia del área Education que tiene gap_detector.py (340 loc),
        curriculum_engine.py (550 loc), y 37 tests — el área Health tiene CERO
        herramientas de dominio. La única herramienta es renata_memory.py (303 loc),
        que es un motor de memoria/gobernanza, no una herramienta de salud.
      comparison: >
        Education: 2 herramientas operativas (gap_detector + curriculum_engine),
        5 más planificadas (knowledge_tracer, transfer_validator, bias_auditor,
        market_aligner en pipeline).
        Health: 0 herramientas operativas, 0 planificadas.
      impact: "El área no puede procesar pacientes, generar planes, ni verificar evidencia de forma automatizada. Toda operación es manual (conversacional)."
      fix: "Crear pipeline de herramientas mínimo: patient_intake → nutrition_planner → exercise_designer."
      estimated_effort: "15-20 días"
      deps: ["Eidren (research evidence)", "Thavren (sandbox/execution)"]

