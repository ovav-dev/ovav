        - Valide contraindicaciones biomecánicas
        - Programe sesiones semanales con ejercicios, sets, reps, RPE
      impact: "Planes de entrenamiento sin validación de seguridad ni progresión automatizada."
      fix: "Implementar exercise_designer.py: assessment → periodization → session builder."
      estimated_effort: "8-12 días"
