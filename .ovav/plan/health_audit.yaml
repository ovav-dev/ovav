        - La validación automatizada de service_profiles no incluye health.
        - Incumple el estándar C6 de 8 perfiles profesionales (solo 2 implementados).
      impact: "Área invisible para el sistema de perfiles de OVAV. El usuario no puede seleccionar Health como perfil profesional en el cPanel."
      fix: "Crear entrada service_profiles para health_performance siguiendo el formato de systems_architect."
      estimated_effort: "2 horas"
      deps: []

