# 4. CROSS-AREA DEPENDENCIES
# ═══════════════════════════════════════════════════════════════════════════

cross_area_dependencies:
  - target_area: "Eidren — Evidence & Decision Intelligence"
    dependency_type: "CRITICAL"
    description: >
      El claim fundacional de Renata ('100% clinical evidence rate') requiere
      un pipeline automatizado de verificación de estudios clínicos. Sin
      integración con el Evidence Pipeline de Eidren, cada verificación es manual.
    needed: >
      - Protocolo de handoff para búsqueda de RCTs y meta-análisis
      - API/interface para consultar base de evidencia médica
      - Verificación automatizada de claims nutricionales y de suplementación
      - Scoring de calidad de evidencia para cada recomendación
    current_state: "Solo declaración de intención en KELDA_SELF_MODEL.yaml. Sin implementación."

  - target_area: "Valeria — Education & Career Development"
    dependency_type: "HIGH"
    description: >
      Los pacientes necesitan entender su plan. Valeria puede generar contenido
      educativo de salud: fundamentos de nutrición, cómo leer etiquetas,
      principios de entrenamiento, higiene del sueño.
    needed: >
      - Plantillas de contenido educativo para pacientes health
      - Módulos de 'Health Literacy' en el curriculum engine
      - Transfer validator para evaluar comprensión del plan
    current_state: "Solo declaración en KELDA_SELF_MODEL.yaml. Sin contenido generado."

  - target_area: "Thavren — Platform Engineering & DX"
    dependency_type: "MEDIUM"
    description: >
      Las herramientas de health necesitan infraestructura: sandbox para ejecución
      segura, session context guard para privacidad de datos de pacientes,
      output verification pipeline.
    needed: >
      - verify_output.py adaptado para claims de salud (clinical evidence gate)
      - Sandbox aislado para ejecución de herramientas health
      - HIPAA-aligned data handling en session context
    current_state: "verify_output.py y session_context_guard.py existen pero sin adaptación health-specific."

  - target_area: "Sofía — Commercial & Growth Strategy"
    dependency_type: "MEDIUM"
    description: >
      El área Health no está monetizada. Sin pricing ni empaquetado.
      Sofía debe diseñar la oferta comercial de servicios health.
    needed: >
      - Tiers de servicio: Assessment → Plan → Coaching → Premium
      - Pricing para consultas health (B2C y B2B)
      - Posicionamiento en landing page y Product Hunt
    current_state: "Sin representación en business_model.yaml."

  - target_area: "Dante — Digital Product Engineering"
    dependency_type: "LOW (futuro)"
    description: >
      A largo plazo, las herramientas health pueden tener UI web:
      meal planner visual, progress dashboard, exercise library.
    needed: >
      - Componentes React para visualización de planes nutricionales
      - Dashboard de progreso con métricas y gráficos
      - Biblioteca visual de ejercicios con animaciones
    current_state: "Sin features health en el producto web."

