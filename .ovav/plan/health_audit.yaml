        validación de rangos, red flag detection (CRIT-R08), privacy-first (SHA-256 hashing,
        sin PII en plaintext). 41 tests PASS. Templates en .ovav/health/intake_templates/
        (default, athlete, weight_loss).

    - id: GAP-H3
      name: "Sin nutrition plan engine"
      severity: "HIGH"
      description: >
        No existe herramienta para componer planes nutricionales a partir de datos
