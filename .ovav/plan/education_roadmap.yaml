# ═══════════════════════════════════════════════════════════════════════════
# 3. KNOWLEDGE TRACER — knowledge_tracer.py [PHASE 2 ✅]
# ═══════════════════════════════════════════════════════════════════════════

knowledge_tracer:
  file: "tools/education/knowledge_tracer.py"
  owner: "Sandra + Beatriz"
  status: "implemented"
  language: "Python 3.12"
  dependencies:
    - "gap_detector.py (skill matrix seeding)"
    - "curriculum_engine.py (module structure)"
  loc: 466

  purpose: >
    Bayesian Knowledge Tracing (BKT) engine. Trackea la probabilidad de
    maestría P(L) de cada skill usando el modelo estándar de 4 parámetros:
    P(L₀), P(T), P(G), P(S). Actualiza P(L) con cada respuesta correcta
    o incorrecta del estudiante. Detecta maestría cuando P(L) ≥ 0.85
    con ≥ 3 observaciones.

  bkt_model:
    p_l0: "Probabilidad inicial de que el estudiante conozca la skill (default: 0.15)"
    p_t:  "Probabilidad de aprendizaje entre oportunidades (default: 0.10)"
    p_g:  "Probabilidad de adivinar correctamente sin saber (default: 0.20)"
    p_s:  "Probabilidad de error aunque sepa la skill (default: 0.10)"
    mastery_threshold: 0.85
    min_observations: 3

  features:
    - "BKT update: P(L|correct) y P(L|incorrect) vía Bayes"
    - "Learning transition: P(L_next) = P(L|obs) + (1-P(L|obs))*P(T)"
    - "Per-skill parameter customization (P_L0, P_T, P_G, P_S)"
    - "Seed from gap_detector output (level → P(L) mapping)"
    - "Mastery detection with minimum observation gate"
    - "Level estimation: P(L) → discrete level (beginner–expert)"
    - "Next-item correctness prediction per skill"
    - "Full trace recording per observation"
    - "Serialization (to_dict / from_dict roundtrip)"
    - "Export for transfer_validator integration"
    - "Summary: readiness, mastered/unmastered lists, level estimates"

  acceptance_criteria:
    - "Correct answer increases P(L)"
    - "Incorrect answer decreases P(L)"
    - "P(L) converges to mastery with repeated correct answers"
    - "P(G) and P(S) influence update magnitude correctly"
    - "Multiple skills tracked independently"
    - "Mastery declared only after threshold + min observations"
    - "Serialization roundtrip preserves state"
    - "Integration with gap_detector seeding works"
    - "All edge cases: empty skills, invalid params, unobserved skill"

  test_results:
    total: 30
    passed: 30
    coverage: "BKT updates, guess/slip params, observations, levels, serialization, next-item prediction, gap detector seeding, summary"

# ═══════════════════════════════════════════════════════════════════════════
# 4. TRANSFER VALIDATOR — transfer_validator.py [PHASE 2 ✅]
# ═══════════════════════════════════════════════════════════════════════════

transfer_validator:
  file: "tools/education/transfer_validator.py"
  owner: "Beatriz + Alicia"
  status: "implemented"
  language: "Python 3.12"
  dependencies:
    - "knowledge_tracer.py (mastery estimates + BKT params)"
    - "curriculum_engine.py (module sequence for path adjustment)"
  loc: 543

  purpose: >
    Predice la probabilidad de éxito en el próximo ítem usando transferencia
    de habilidades. Modelo TWNIC: Transfer-Weighted Next-Item Correctness.
    P(correct_next|skill_i) = Σ w_ij * P(L_j) * (1-P(S_j)).
    Valida transferencia entre conceptos relacionados y genera recomendaciones
    de ajuste de ruta para el curriculum_engine.

  transfer_matrix:
    description: >
      Matriz de transferencia entre 20 skills. Define cuánto contribuye
      el dominio de una skill al aprendizaje de otra (0.0–1.0).
      Self-transfer = 1.0, default transfer = 0.10.
      Fuente: literatura de ciencia del aprendizaje + dominio experto.
    skills_covered: 20
    entries: "~100 conexiones dirigidas"

  features:
    - "TWNIC: next-item correctness via transfer-weighted mastery"
    - "Transfer vector: normalized weights from all skills to target"
    - "Transfer gap: 1 - related mastery average"
    - "Readiness score: 0.5*self_mastery + 0.5*next_correct"
    - "Module readiness: aggregate per-skill predictions"
    - "Best transfer path: greedy search for strongest transfer chain"
    - "Path adjustment recommendations: delay, reinforce, accelerate"
    - "Integration with knowledge_tracer export format"
    - "Custom transfer matrix support"
    - "Summary: avg_readiness, high/low transfer skills, warnings"

  path_adjustments:
    delay: "Prerrequisitos no transferidos → mover módulo más tarde"
    reinforce: "Transferencia insuficiente → agregar refuerzo"
    accelerate: "Alta transferencia desde otras skills → acelerar"

  acceptance_criteria:
    - "Predictions always in [0, 1]"
    - "High mastery + low slip → high prediction"
    - "Low mastery → lower prediction (with guessing floor)"
    - "Related mastered skills boost prediction for target"
    - "Transfer gap zero when all skills mastered"
    - "Module readiness gates work (ready/not ready)"
    - "Path adjustments generated correctly for each scenario"
    - "Summary with avg_readiness, transfer gaps, warnings"

  test_results:
    total: 26
    passed: 26
    coverage: "initialization, transfer weights, next-item prediction, module readiness, transfer path, path adjustments, summary"

# ═══════════════════════════════════════════════════════════════════════════
# 5. PRIORIZACIÓN — Orden de construcción de las 6 herramientas
# ═══════════════════════════════════════════════════════════════════════════

prioritization:
  context: >
    El área de Education tiene 6 herramientas planificadas. Las primeras 2
    (gap_detector, curriculum_engine) son la fase 1 de SEG-6. La priorización
    completa es:

  tools:
    - rank: 1
      tool: "gap_detector.py"
      why_first: >
        Es la puerta de entrada. Sin diagnóstico no hay plan.
        Todo el pipeline educativo depende de tener gaps bien identificados.
        Además, es la herramienta que más rápido da valor al usuario:
        en 2 segundos recibe un mapa claro de dónde está parado.
        Carmen y Sandra pueden construirlo en 3 días con los fixtures de prueba.
      dependency_of: ["curriculum_engine", "knowledge_tracer", "transfer_validator"]
      estimated_days: 3
      squad: "Carmen + Sandra"

    - rank: 2
      tool: "curriculum_engine.py"
      why_first: >
        Segundo porque consume los gaps del detector. Sin plan de estudios
        no hay ruta de aprendizaje. Es el corazón del área: transforma
        diagnóstico en acción. Felipe ya tiene experiencia en diseño de
        prerrequisitos desde su trabajo en Río. Beatriz aporta la ciencia
        del aprendizaje para la estimación de horas.
      dependency_of: ["knowledge_tracer", "transfer_validator"]
      estimated_days: 5
      squad: "Felipe + Beatriz"

    - rank: 3
      tool: "knowledge_tracer.py"
      status: "✅ IMPLEMENTADO — Phase 2 (2026-06-16)"
      why_first: >
        Tercero porque requiere que el curriculum_engine esté listo para
        trackear progreso por módulo. Implementa Bayesian Knowledge Tracing
        (BKT) para estimar probabilidad de maestría de cada concepto.
        Esta herramienta cierra el ciclo de feedback: ¿está funcionando
        el plan que generamos?
      dependency_of: ["transfer_validator", "bias_auditor"]
      estimated_days: 0  # completado
      actual_days: 1
      squad: "Sandra + Beatriz → Valeria (Lead)"
      loc: 466
      tests: 30

    - rank: 4
      tool: "transfer_validator.py"
      status: "✅ IMPLEMENTADO — Phase 2 (2026-06-16)"
      why_first: >
        Cuarto porque mide si el aprendizaje se transfiere a contextos
        nuevos (next-item correctness). Sin esto, podemos tener estudiantes
        que pasan quizzes pero no resuelven problemas reales. Es el
        metricáculo de calidad educativa más importante del sistema.
      dependency_of: ["market_aligner"]
      estimated_days: 0  # completado
      actual_days: 1
      squad: "Beatriz + Alicia → Valeria (Lead)"
      loc: 543
      tests: 26

    - rank: 5
      tool: "bias_auditor.py"
      status: "✅ IMPLEMENTADO — Phase 3 (2026-06-16)"
      why_first: >
        Quinto porque audita todo el pipeline anterior en busca de sesgos:
        ¿el detector subestima a estudiantes hispanohablantes? ¿el curriculum
        engine recomienda rutas más cortas a hombres que a mujeres con
        mismo perfil? Cumplimiento AIED 2026. Alicia lidera desde Toronto.
      dependency_of: []
      estimated_days: 6
      squad: "Alicia + Teo"
      note: >
        Corre sobre datos agregados — puede ejecutarse en paralelo con
        transfer_validator si hay capacidad.

    - rank: 6
      tool: "market_aligner.py"
      status: "✅ IMPLEMENTADO — Phase 3 (2026-06-16)"
      why_first: >
        Sexto porque alinea el output del curriculum con la demanda real
        del mercado laboral (scraping de job posts, tendencias de LinkedIn,
        Stack Overflow survey). Es la capa de "¿esto para qué me sirve?".
        Teo lidera desde Singapur con datos frescos del mercado APAC y LATAM.
      dependency_of: []
      estimated_days: 5
      squad: "Teo + Carmen"
      note: >
        Corre en paralelo con bias_auditor. Requiere API keys de fuentes
        de mercado laboral (a gestionar con Sofía).

  decision_summary: >
    gap_detector → curriculum_engine → knowledge_tracer → transfer_validator
    → bias_auditor ∥ market_aligner (paralelo al final)

# ═══════════════════════════════════════════════════════════════════════════
# 4. TAXONOMÍA DE HABILIDADES — 20 skills con niveles
# ═══════════════════════════════════════════════════════════════════════════

skills_taxonomy:
  version: "1.0"
  description: >
    Taxonomía canónica de 20 habilidades técnicas y blandas organizadas
    en 4 categorías. Cada skill tiene 5 niveles progresivos con descriptores
    conductuales observables. Inspirada en el Marco Europeo de Competencias
    Digitales (DigComp 2.2) y el SFIA Framework v9.

  levels:
    - id: "L0"
      name: "beginner"
      description: "No tiene conocimiento previo. Puede reconocer términos pero no aplicarlos."
      indicators:
        - "Identifica conceptos básicos si se los mencionan."
        - "No puede completar tareas sin guía paso a paso."
        - "Comete errores frecuentes de sintaxis o concepto."
    - id: "L1"
      name: "novice"
      description: "Conocimiento fundamental. Ejecuta tareas simples con supervisión."
      indicators:
        - "Escribe código funcional en ejercicios guiados."
        - "Necesita documentación para tareas no rutinarias."
        - "Entiende el 60% de un tutorial sin pausar."
    - id: "L2"
      name: "intermediate"
      description: "Autonomía parcial. Resuelve problemas de mediana complejidad sin ayuda."
      indicators:
        - "Debuggea sus propios errores en < 30 min."
        - "Participa en code reviews como reviewer junior."
        - "Completa proyectos personales sin scaffolding."
    - id: "L3"
      name: "advanced"
      description: "Dominio operativo. Diseña soluciones, optimiza y mentoriza."
      indicators:
        - "Diseña arquitectura de un módulo o servicio completo."
        - "Identifica bugs sutiles en código ajeno."
        - "Escribe documentación técnica clara para otros devs."
        - "Mentoriza a beginners y novices efectivamente."
    - id: "L4"
      name: "expert"
      description: "Maestría. Define estándares, innova y enseña a advanced."
      indicators:
        - "Contribuye a proyectos open-source del ecosistema."
        - "Publica artículos, charlas o cursos sobre el tema."
        - "Resuelve problemas que otros consideran irresolubles."
        - "Define buenas prácticas que adopta el equipo u organización."

  categories:
    - category: "programming_fundamentals"
      label: "Fundamentos de Programación"
      skills:
        - name: "python"
          description: "Lenguaje Python — sintaxis, ecosistema, buenas prácticas."
          bloom_taxonomy: "Create"
          target_level_by_role:
            backend_developer: "advanced"
            data_scientist: "advanced"
            fullstack_developer: "intermediate"
            ml_engineer: "advanced"
            devops_engineer: "intermediate"

        - name: "javascript"
          description: "JavaScript/TypeScript — frontend y backend con Node.js."
          bloom_taxonomy: "Create"
          target_level_by_role:
            fullstack_developer: "advanced"
            frontend_developer: "expert"
            backend_developer: "intermediate"

        - name: "go"
          description: "Lenguaje Go — sistemas, CLI, servicios de red."
          bloom_taxonomy: "Create"
          target_level_by_role:
            backend_developer: "advanced"
            devops_engineer: "advanced"
            platform_engineer: "expert"

        - name: "sql"
          description: "Consultas, diseño de bases de datos relacionales, optimización."
          bloom_taxonomy: "Apply"
          target_level_by_role:
            backend_developer: "advanced"
            data_scientist: "intermediate"
            data_engineer: "expert"
            fullstack_developer: "intermediate"

        - name: "git"
          description: "Control de versiones, branching strategies, code review."
          bloom_taxonomy: "Apply"
          target_level_by_role:
            all_roles: "intermediate"

        - name: "shell_scripting"
          description: "Bash/PowerShell — automatización de tareas, CI/CD scripting."
          bloom_taxonomy: "Apply"
          target_level_by_role:
            devops_engineer: "advanced"
            backend_developer: "intermediate"
            platform_engineer: "advanced"

    - category: "data_and_ai"
      label: "Datos e Inteligencia Artificial"
      skills:
        - name: "statistics"
          description: "Estadística descriptiva e inferencial, pruebas de hipótesis."
          bloom_taxonomy: "Analyze"
          target_level_by_role:
            data_scientist: "advanced"
            ml_engineer: "advanced"
            data_analyst: "expert"

        - name: "machine_learning"
          description: "Modelos supervisados y no supervisados, evaluación, deployment."
          bloom_taxonomy: "Evaluate"
          target_level_by_role:
            data_scientist: "advanced"
            ml_engineer: "expert"

        - name: "data_visualization"
          description: "Comunicación visual de datos — matplotlib, seaborn, D3.js, Power BI."
          bloom_taxonomy: "Create"
          target_level_by_role:
            data_scientist: "intermediate"
            data_analyst: "advanced"
            business_analyst: "expert"

        - name: "deep_learning"
          description: "Redes neuronales, PyTorch/TensorFlow, NLP, computer vision."
          bloom_taxonomy: "Evaluate"
          target_level_by_role:
            ml_engineer: "advanced"
            ai_researcher: "expert"

        - name: "data_engineering"
          description: "ETL/ELT pipelines, Apache Spark/Airflow, data warehousing."
          bloom_taxonomy: "Create"
          target_level_by_role:
            data_engineer: "expert"
            data_scientist: "intermediate"
            backend_developer: "novice"

    - category: "web_and_systems"
      label: "Desarrollo Web y Sistemas"
      skills:
        - name: "frontend_development"
          description: "HTML, CSS, React/Vue/Angular, responsive design, a11y."
          bloom_taxonomy: "Create"
          target_level_by_role:
            frontend_developer: "expert"
            fullstack_developer: "advanced"

        - name: "backend_development"
          description: "APIs REST/GraphQL, autenticación, bases de datos, arquitectura de servidores."
          bloom_taxonomy: "Create"
          target_level_by_role:
            backend_developer: "expert"
            fullstack_developer: "advanced"

        - name: "devops_and_cloud"
          description: "Docker, Kubernetes, CI/CD, AWS/GCP/Azure, infraestructura como código."
          bloom_taxonomy: "Apply"
          target_level_by_role:
            devops_engineer: "expert"
            platform_engineer: "advanced"
            backend_developer: "intermediate"

        - name: "system_design"
          description: "Arquitectura de sistemas distribuidos, escalabilidad, patrones de diseño."
          bloom_taxonomy: "Evaluate"
          target_level_by_role:
            backend_developer: "advanced"
            platform_engineer: "expert"
            solutions_architect: "expert"

        - name: "cybersecurity"
          description: "OWASP Top 10, criptografía aplicada, modelado de amenazas."
          bloom_taxonomy: "Evaluate"
          target_level_by_role:
            security_engineer: "expert"
            backend_developer: "intermediate"
            devops_engineer: "intermediate"

    - category: "professional_skills"
      label: "Habilidades Profesionales Transversales"
      skills:
        - name: "technical_writing"
          description: "Documentación técnica clara, ADRs, RFCs, postmortems."
          bloom_taxonomy: "Create"
          target_level_by_role:
            all_roles: "intermediate"
            tech_lead: "expert"

        - name: "code_review"
          description: "Revisión de código efectiva, feedback constructivo, seguridad y estilo."
          bloom_taxonomy: "Evaluate"
          target_level_by_role:
            all_roles: "intermediate"
            tech_lead: "expert"

        - name: "problem_solving"
          description: "Descomposición de problemas complejos, pensamiento algorítmico, depuración sistemática."
          bloom_taxonomy: "Analyze"
          target_level_by_role:
            all_roles: "advanced"

        - name: "project_management"
          description: "Metodologías ágiles, estimación, gestión de stakeholders, priorización."
          bloom_taxonomy: "Apply"
          target_level_by_role:
            tech_lead: "advanced"
            engineering_manager: "expert"

  # ── Matriz de progresión para Python (ejemplo detallado) ──────────────────

  skill_progression_example:
    skill: "python"
    levels_detail:
      beginner:
        can:
          - "Reconocer sintaxis básica de Python (indentación, comentarios, print)."
          - "Ejecutar un script .py desde la terminal."
          - "Declarar variables simples (int, float, str, bool)."
        cannot:
          - "Escribir una función desde cero."
          - "Usar listas o diccionarios para estructurar datos."
          - "Debuggear un error sin ayuda externa."
        assessment_sample:
          task: "Corregir un script con 3 errores de sintaxis obvios."
          passing_time: "< 10 minutos"

      novice:
        can:
          - "Escribir funciones con parámetros y return."
          - "Usar listas, diccionarios y sets para modelar datos simples."
          - "Leer y escribir archivos CSV con el módulo csv."
          - "Instalar paquetes con pip y usar entornos virtuales (venv)."
        cannot:
          - "Escribir clases con herencia o decoradores."
          - "Usar comprehensions de lista de forma natural."
          - "Escribir tests unitarios con pytest."
        assessment_sample:
          task: "Procesar un CSV de 1000 líneas: filtrar, agrupar y escribir resumen."
          passing_time: "< 45 minutos"

      intermediate:
        can:
          - "Usar clases, herencia, métodos estáticos y properties."
          - "Escribir list/dict comprehensions idiomáticas."
          - "Usar generators (yield) para datos grandes."
          - "Escribir tests con pytest (fixtures, parametrize, mocks)."
          - "Manejar excepciones con granularidad (no capturar Exception genérico)."
          - "Usar type hints en Python 3.10+."
        cannot:
          - "Escribir un decorador parametrizado desde cero."
          - "Optimizar código con profiling (cProfile, memory_profiler)."
          - "Diseñar una API REST con FastAPI autodocumentada."
        assessment_sample:
          task: "Refactorizar un script monolítico de 500 líneas en 3 módulos con tests."
          passing_time: "< 2 horas"

      advanced:
        can:
          - "Escribir decoradores, context managers y descriptores."
          - "Usar asyncio para I/O concurrente (aiohttp, httpx)."
          - "Hacer profiling y optimizar hotspots de CPU/memoria."
          - "Diseñar una API REST con FastAPI, Pydantic v2, y OpenAPI."
          - "Configurar CI/CD (GitHub Actions) con lint, test, coverage gate."
          - "Publicar un paquete en PyPI con pyproject.toml."
        cannot:
          - "Escribir una extensión en C o Rust para Python."
          - "Hacer metaprogramación avanzada (metaclasses, AST manipulation)."
          - "Contribuir al core de CPython o una librería mayor."
        assessment_sample:
          task: "Construir microservicio con FastAPI + SQLAlchemy async + Redis cache. 85% coverage."
          passing_time: "< 8 horas"

      expert:
        can:
          - "Escribir extensiones nativas (Cython, PyO3/Rust)."
          - "Hacer metaprogramación: decoradores que modifican AST, metaclasses."
          - "Contribuir a CPython, pip, pytest, FastAPI u otra librería core."
          - "Dar charlas en PyCon / EuroPython con propuesta aceptada."
          - "Diseñar la arquitectura Python de un sistema con 1M+ usuarios."
          - "Mentorizar a advanced developers en journey a expert."
        cannot:
          - "No hay 'cannot' — es el techo de la taxonomía."
        assessment_sample:
          task: "Proponer y mergear un PEP  (Python Enhancement Proposal) o contribución significativa a proyecto core."
          passing_time: "meses — este nivel se verifica por portfolio, no por prueba cronometrada."

