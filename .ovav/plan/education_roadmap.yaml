# ═══════════════════════════════════════════════════════════════════════════
# 1. GAP DETECTOR — gap_detector.py
# ═══════════════════════════════════════════════════════════════════════════

gap_detector:
  file: "tools/education/gap_detector.py"
  owner: "Carmen + Sandra"
  status: "spec_ready"
  language: "Python 3.12"
  dependencies: []

  purpose: >
    Recibe un self-assessment YAML del estudiante y produce un JSON
    estructurado con los gaps de conocimiento identificados. Usa el
    modelo RPKT (Rasch-based Proficiency Knowledge Tracing) para
    estimar nivel real vs. nivel declarado, ajustando por sesgo de
    autoevaluación (Dunning-Kruger correction).

  input_schema:
    format: "YAML"
    fields:
      student_id: "string — identificador único del estudiante"
      career_goal: "string — rol objetivo (ej: 'Data Scientist', 'Full-Stack Developer')"
      self_assessment:
        type: "list of skill objects"
        skill:
          name: "string — nombre canónico de la skill (de la taxonomía)"
          self_rated_level: "enum: beginner | novice | intermediate | advanced | expert"
          years_experience: "float — años de práctica declarados"
          last_used: "string — fecha ISO o 'never'"
          confidence: "float 0.0–1.0 — qué tan seguro se siente el estudiante"
          evidence:
            - "string — proyecto, curso o certificación que respalda el nivel declarado"

  example_input: |
    student_id: "stu-0042"
    career_goal: "Data Scientist"
    self_assessment:
      - skill: "python"
        self_rated_level: "intermediate"
        years_experience: 2.0
        last_used: "2026-03-01"
        confidence: 0.7
        evidence:
          - "Curso 'Python for Everybody' en Coursera"
          - "Scripts de automatización en trabajo actual"
      - skill: "sql"
        self_rated_level: "beginner"
        years_experience: 0.5
        last_used: "2025-12-01"
        confidence: 0.3
        evidence:
          - "Tutorial de SQLZoo completado"
      - skill: "statistics"
        self_rated_level: "novice"
        years_experience: 0.0
        last_used: "never"
        confidence: 0.1
        evidence: []
      - skill: "machine_learning"
        self_rated_level: "novice"
        years_experience: 0.0
        last_used: "never"
        confidence: 0.1
        evidence: []
      - skill: "data_visualization"
        self_rated_level: "beginner"
        years_experience: 1.0
        last_used: "2026-01-15"
        confidence: 0.5
        evidence:
          - "Reportes en Power BI para gerencia"

  processing_pipeline:
    - step: "parse"
      action: "Validar schema YAML. Rechazar con error descriptivo si falta campo obligatorio."
    - step: "normalize"
      action: "Mapear nombres de skill a taxonomía canónica (fuzzy match, umbral 0.85)."
    - step: "estimate_real_level"
      action: >
        Aplicar RPKT: combinar self_rated_level, years_experience, confidence,
        y evidence en una estimación bayesiana del nivel real. Ajustar por
        Dunning-Kruger: si confidence es alta pero evidence es escasa, degradar
        nivel estimado en 1 categoría.
    - step: "compute_gap"
      action: >
        Para cada skill requerida por el career_goal (según matriz de
        requerimientos), comparar nivel estimado con target_level. Si
        estimated < target, registrar gap con severidad.
    - step: "prioritize"
      action: >
        Ordenar gaps por: (1) bloqueante para prerequisitos, (2) severidad
        del gap, (3) criticidad para el career_goal.

  output_schema:
    format: "JSON"
    fields:
      student_id: "string"
      career_goal: "string"
      generated_at: "ISO timestamp"
      gaps:
        type: "list"
        item:
          skill: "string — nombre canónico"
          estimated_level: "enum: beginner | novice | intermediate | advanced | expert"
          target_level: "enum: beginner | novice | intermediate | advanced | expert"
          gap_severity: "int — diferencia en niveles (1=marginal, 4=crítico)"
          priority: "int — orden de ataque (1=urgente)"
          dunning_kruger_flag: "bool — true si confidence > evidence sugiere sobreestimación"
          rationale: "string — explicación legible del gap"

  example_output: |
    {
      "student_id": "stu-0042",
      "career_goal": "Data Scientist",
      "generated_at": "2026-06-15T20:40:00-0500",
      "gaps": [
        {
          "skill": "python",
          "estimated_level": "novice",
          "target_level": "advanced",
          "gap_severity": 3,
          "priority": 1,
          "dunning_kruger_flag": true,
          "rationale": "Autoevaluado como intermediate pero 0 proyectos complejos ni librerías DS (numpy/pandas). Confianza 0.7 con evidencia débil → Dunning-Kruger correction aplicada."
        },
        {
          "skill": "statistics",
          "estimated_level": "novice",
          "target_level": "advanced",
          "gap_severity": 4,
          "priority": 2,
          "dunning_kruger_flag": false,
          "rationale": "Sin experiencia ni formación en estadística. Crítico para ML."
        },
        {
          "skill": "machine_learning",
          "estimated_level": "novice",
          "target_level": "intermediate",
          "gap_severity": 3,
          "priority": 3,
          "dunning_kruger_flag": false,
          "rationale": "Sin exposición previa. Requiere fundamentos de estadística primero."
        },
        {
          "skill": "sql",
          "estimated_level": "beginner",
          "target_level": "intermediate",
          "gap_severity": 2,
          "priority": 4,
          "dunning_kruger_flag": false,
          "rationale": "Sintaxis básica aprendida. Falta práctica con JOINs, subconsultas, window functions."
        },
        {
          "skill": "data_visualization",
          "estimated_level": "beginner",
          "target_level": "intermediate",
          "gap_severity": 2,
          "priority": 5,
          "dunning_kruger_flag": false,
          "rationale": "Conocimiento limitado a Power BI. Se requiere matplotlib/seaborn/plotly en Python."
        }
      ]
    }

  test_fixtures:
    - area: "Python"
      career_goal: "Backend Developer"
    - area: "Data Science"
      career_goal: "Data Scientist"
    - area: "Web Dev"
      career_goal: "Full-Stack Developer"

  acceptance_criteria:
    - "YAML inválido → error descriptivo, no crash"
    - "Skill no canónica → fuzzy match exitoso o flag 'unmapped_skill'"
    - "Gaps ordenados por prioridad correcta (bloqueante primero)"
    - "Dunning-Kruger flag aparece en al menos 1 caso del fixture"
    - "output JSON válido contra schema"
    - "Tiempo de ejecución < 2s para 10 skills"

