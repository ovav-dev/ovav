  purpose: >
    Toma los gaps del detector + el perfil profesional del estudiante
    y genera un learning path YAML con módulos ordenados por grafo de
    prerrequisitos. Cada módulo incluye objetivos de aprendizaje,
    recursos, estimación de horas y criterios de maestría.

  input_schema:
    format: "JSON (output de gap_detector) + YAML (perfil profesional)"
    fields:
      gaps: "JSON — output completo de gap_detector.py"
      profile:
        student_id: "string"
        career_goal: "string"
        available_hours_per_week: "int"
        learning_style: "enum: visual | auditory | reading | kinesthetic | mixed"
        preferred_language: "enum: es | en | pt"
        time_constraint_days: "int — plazo máximo deseado (0 = sin límite)"
        prior_modules_completed:
          type: "list of string — IDs de módulos ya completados"

  prerequisite_graph:
    description: >
      Grafo acíclico dirigido que define el orden de módulos.
      Cada skill tiene prerrequisitos duros (no se puede cursar sin ellos)
      y blandos (recomendados pero no bloqueantes).
