# ── SEG-0: Critical Security & Governance Fixes (HOY) ─────────────────────
# Bloqueantes — no se puede seguir sin estos fixes

SEG0:
  name: "Critical Foundation — Security & Governance Root Fixes"
  priority: "P0 — BLOQUEANTE"
  estimated_hours: 4
  tasks:
    C0-C1:
      name: "Fix Git command injection in Go cPanel API"
      file: "go-runtime/cmd/cpanel/git.go:55-60"
      severity: "CRITICAL"
      root_cause: "handleGitLog accepts unsanitized 'limit' from URL query, passes to exec.Command as flag"
      fix: "strconv.Atoi(limit) before use — reject non-integer input with 400"
      verification: "curl 'https://api.ovav.dev/api/v1/git/log?limit=1;--exec' → 400 Bad Request"
      verifier: "Diana + Clara"
      assigned: "Thavren → Andrés"

    C0-C2:
      name: "Eradicate deprecated memory references from Go runtime"
      files:
        - "go-runtime/cmd/cpanel/memory.go"
        - "go-runtime/cmd/cpanel/validators.go"
        - "go-runtime/internal/doctor/diagnostic.go"
      severity: "CRITICAL"
      root_cause: "AGENTS.md blocks separate memory ledger files."
      fix: "Reemplazar lecturas por git HEAD + caps.yaml como fuentes canónicas."
      verification: "Go runtime no references blocked memory files."
      verifier: "Diana + Thavren"
      assigned: "Thavren → Marco"

    C0-C3:
      name: "Initialize OVAV Vault with AES-256-GCM only"
      files:
        - "tools/security/secrets_vault.py"
        - "tools/security/credential_vault.py"
      severity: "CRITICAL"
      root_cause: "Vault directory not created. XOR cipher in secrets_vault (cryptographically weak). Go vault exists but Python fallback is insecure."
      fix: | 
        1. Create .ovav/vault/ with master.key (PBKDF2 + machine-id salt)
        2. Remove XOR cipher from secrets_vault.py — require AES-256-GCM
        3. Run 'ovav vault scan && ovav vault encrypt' to encrypt all assets
        4. Verify: .ovav/vault/*.enc exists with valid AES-256-GCM
      verification: "python3 -c 'from tools.security.secrets_vault import _encrypt; assert \"XOR\" not in inspect.getsource(_encrypt)'"
      verifier: "Diana"
      assigned: "Diana + Thavren"

    C0-C4:
      name: "Fix gofmt violation in cmd/ovav/main.go"
      file: "go-runtime/cmd/ovav/main.go"
      severity: "HIGH"
      root_cause: "gofmt not run after cockpit route addition"
      fix: "gofmt -w cmd/ovav/main.go && go vet ./..."
      verification: "gofmt -l cmd/ovav/main.go → empty (no output)"
      verifier: "Thavren"
      assigned: "Thavren → Lucas"
      status: "done"  # Already fixed in audit session

    C0-C5:
      name: "Remove bin/__pycache__/ from repo"
      file: "bin/__pycache__/ovav.cpython-312.pyc"
      severity: "MEDIUM"
      fix: "git rm -r bin/__pycache__/ && echo 'bin/__pycache__/' >> .gitignore (if not already)"
      verification: "git ls-files bin/__pycache__ → empty"
      verifier: "Thavren"
      assigned: "Thavren → Lucas"

