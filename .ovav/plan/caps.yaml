# ══════════════════════════════════════════════════════════════════════════════
# AUTO-INTEGRATION NATIVE ENGINE v1.0
# ──────────────────────────────────────────────────────────────────────────────
# OVAV Native Subsystems Integration - Autonomous Self-Triggering Engine
# All subsystems are interconnected and auto-trigger based on context
# ══════════════════════════════════════════════════════════════════════════════

integration:
  version: "1.0"
  status: "active"
  mode: "real_time_autonomous"
  
  # ── Trigger Rules ───────────────────────────────────────────────────────
  trigger_rules:
    
    memory_index_on_change:
      enabled: true
      triggers:
        - event: "file_changed"
          patterns: ["*.go", "*.yaml", "*.md"]
          action: "index_memory_card"
          async: true
      
    research_on_schedule:
      enabled: true
      schedule: "daily"
      time: "06:00"
      action: "run_research_cycle"
      
    test_on_commit:
      enabled: true
      triggers:
        - event: "git_pre_commit"
          action: "run_security_tests"
          blocking: true
      
    validate_on_push:
      enabled: true
      triggers:
        - event: "git_pre_push"
          action: "run_full_validation"
          blocking: true
      
    cost_track_on_api_call:
      enabled: true
      triggers:
        - event: "api_response"
          action: "record_token_usage"
      
    memory_search_on_query:
      enabled: true
      triggers:
        - event: "agent_query"
          patterns: ["memory", "remember", "previous", "before"]
          action: "semantic_memory_search"
      
    plan_update_on_completion:
      enabled: true
      triggers:
        - event: "task_completed"
          action: "update_plan_progress"

  # ── Subsystem Connections ───────────────────────────────────────────────
  connections:
    
    memory_research_link:
      from: "memory"
      to: "research"
      trigger: "new_findings"
      action: "index_research_findings"
      
    research_memory_link:
      from: "research"
      to: "memory"
      trigger: "new_discovery"
      action: "store_discovery_card"
      
    test_connect_link:
      from: "test"
      to: "connect"
      trigger: "high_cost_detected"
      action: "alert_cost_threshold"
      
    plan_validate_link:
      from: "plan"
      to: "validators"
      trigger: "task_added"
      action: "validate_task_requirements"
      
    memory_validate_link:
      from: "memory"
      to: "validators"
      trigger: "card_created"
      action: "validate_memory_policy"

  # ── Autonomous Modes ───────────────────────────────────────────────────
  autonomous_modes:
    
    background_daemon:
      enabled: true
      description: "Background process monitoring and triggering"
      subsystems:
        - name: "research_monitor"
          interval: "24h"
          action: "check_provider_updates"
        - name: "memory_indexer"
          interval: "1h"
          action: "reindex_changed_cards"
        - name: "cost_aggregator"
          interval: "1h"
          action: "aggregate_daily_costs"
        - name: "test_scheduler"
          interval: "12h"
          action: "run_security_scan"
      
    foreground_integration:
      enabled: true
      description: "Integration during active AI work"
      triggers:
        - harness_event: "agent_start"
          action: "inject_context_pack"
        - harness_event: "agent_end"
          action: "store_session_memory"
        - harness_event: "file_modified"
          action: "update_memory_index"
        - harness_event: "api_call"
          action: "track_tokens"

  # ── Offline/Online Modes ────────────────────────────────────────────────
  connectivity_modes:
    
    online:
      sync: true
      services:
        - "research_scraping"
        - "cost_api_tracking"
        - "cloud_backup"
    
    offline:
      sync: false
      local_only:
        - "memory_search"
        - "local_validation"
        - "task_management"
        - "test_runner"
        - "plan_tracking"

# ── Layer 2-11 Integration Summary ─────────────────────────────────────────

layer_integration:
  
  L0_validators:
    connected_to: ["memory", "test", "connect"]
    triggers: ["on_validate", "on_commit", "on_push"]
    outputs: ["validation_results", "security_findings"]
  
  L1_python_go:
    connected_to: ["validators", "connect"]
    status: "COMPLETE"
    note: "Python governance deprecated, Go native 95%"
  
  L2_memory_v4:
    connected_to: ["research", "validators", "test"]
    triggers: ["on_query", "on_file_change", "on_session_start"]
    outputs: ["semantic_results", "context_packs"]
    capabilities:
      - "vector_embeddings"
      - "semantic_search"
      - "hybrid_search"
      - "deduplication"
  
  L3_harnesses:
    connected_to: ["memory", "convert", "validate"]
    outputs: ["agent_configs", "runtime_agents"]
    harnesses: ["opencode", "mimocode", "claude", "cursor", "windsurf", "copilot", "continue", "aider", "goose"]
  
  L4_research:
    connected_to: ["memory", "test", "alert"]
    triggers: ["scheduled", "manual"]
    outputs: ["findings", "changes", "alerts"]
    providers: ["openai", "anthropic", "google-ai", "openrouter", "owasp"]
  
  L5_connect:
    connected_to: ["test", "plan", "memory"]
    triggers: ["on_api_call", "scheduled"]
    outputs: ["usage_records", "cost_reports"]
    providers: ["openai", "anthropic"]
  
  L6_testing:
    connected_to: ["connect", "validators", "memory"]
    triggers: ["on_commit", "scheduled", "manual"]
    outputs: ["test_results", "vulnerability_reports", "coverage"]
  
  L7_plan:
    connected_to: ["validators", "memory"]
    triggers: ["on_task_add", "on_task_complete"]
    outputs: ["progress_reports", "layer_status"]
  
  L8_worktrees:
    connected_to: ["validators", "memory"]
    triggers: ["on_branch", "on_merge"]
    outputs: ["worktree_status", "conflict_predictions"]
  
  L9_login:
    connected_to: ["vault", "connect"]
    triggers: ["on_start", "on_auth"]
    outputs: ["session_token", "vault_unlock"]
  
  L10_piaplugin:
    connected_to: ["all"]
    triggers: ["on_agent_start", "on_tool_call"]
    outputs: ["extended_capabilities"]
  
  L11_polish:
    connected_to: ["all"]
    triggers: ["on_build", "on_release"]
    outputs: ["documentation", "changelog"]

