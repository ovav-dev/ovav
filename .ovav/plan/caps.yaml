# ── Architecture ──────────────────────────────────────────────────────────

architecture:
  pattern: layered_governor
  surfaces:
    - go-runtime (CLI, validators, OWS, vault)
    - runtimes/ (agent harness)
    - .ovav/ (governor state, plans, laws)
  key_components:
    - cmd/ovav — main CLI
    - cmd/cpanel — control panel backend
    - cmd/cockpit — TUI
    - internal/vault — secrets subsystem
    - internal/ows — worktree system (incl. own/nuke)
    - internal/convert — RuntimeConverter subsystem (mimocode, opencode, claude, cursor, windsurf, copilot, continue, aider, goose)
    - internal/validators — 71 validators (DefaultRegistry)
    - internal/validators/domain_tracker — URL novelty detection
    - internal/validators/context_firewall_v2 — scope-filtered URL firewall

# ── Governance Workflow ───────────────────────────────────────────────────

governance_workflow:
  branch_model: develop → feature/* worktrees
  merge_gate: owv validates before owd merge
  push_enforcement: HTTPS-only via git_push gate
  security_model: F4 + L6 Zero Trust
  nuke_command: "own — nuclear delete (worktree + branch + remote, no merge)"

