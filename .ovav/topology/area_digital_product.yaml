# Digital Product Engineering — Topology Contract
# Área de servicio profesional OVAV
# Este archivo define la jerarquía, delegación y reglas de visibilidad.
# Es leído por el governor runtime para ENFORZAR la topología en ejecución.

area:
  name: Web Development
  id: area_digital_product
  description: "◆ Área de servicio · Frontend · Backend · Full-Stack · Producto completo"
  scope:
    - full_stack_web_development
    - frontend_react_nextjs_vue_svelte
    - backend_apis_databases
    - ci_cd_product_deploy
    - ui_ux_design_product
    - qa_testing_automated_e2e
    - database_modeling_migrations
    - api_security_auth
    - project_management_product
    - code_review_quality

lead:
  role_id: digital_product_lead
  name: Dante
  canonical: .ovav/source/agents/leads/dante.md
  agent_file: lead-dante.md
  mode: subagent
  visible_in_at: true
  description: "✦ Digital Product Engineering Lead · Full-Stack · Arquitectura · Producto"
  voice: primary_user_facing
  tone: direct_technical_precise_mentor

squads:
  - name: Sergio
    canonical: .ovav/source/agents/teams/digital-product/sergio.md
    agent_file: team-sergio.md
    role: backend_engineer
    description: "APIs, bases de datos, lógica de servidor"
    can_delegate_to: []

  - name: Elena
    canonical: .ovav/source/agents/teams/digital-product/elena.md
    agent_file: team-elena-frontend.md
    role: frontend_engineer
    description: "React, Vue, Svelte, performance, accessibility"
    can_delegate_to: []

  - name: Uriel
    canonical: .ovav/source/agents/teams/digital-product/uriel.md
    agent_file: team-uriel-devops.md
    role: devops_engineer
    description: "Docker, CI/CD, deploy, monitoreo del producto"
    can_delegate_to: []

  - name: Diego
    canonical: .ovav/source/agents/teams/digital-product/diego.md
    agent_file: team-diego.md
    role: qa_engineer
    description: "Testing automatizado, e2e, performance del producto"
    can_delegate_to: []

  - name: Rosa
    canonical: .ovav/source/agents/teams/digital-product/rosa.md
    agent_file: team-rosa.md
    role: project_manager
    description: "Planificación, milestones, delivery"
    can_delegate_to: []

  - name: Víctor
    canonical: .ovav/source/agents/teams/digital-product/victor.md
    agent_file: team-victor.md
    role: database_architect
    description: "Modelado de datos, migraciones, optimización"
    can_delegate_to: []

  - name: Nora
    canonical: .ovav/source/agents/teams/digital-product/nora.md
    agent_file: team-nora.md
    role: api_security_engineer
    description: "API design, auth, OWASP compliance"
    can_delegate_to: []

delegation_rules:
  max_depth: 2
  cross_squad: false
  require_lead_approval_for:
    - production_deploy
    - database_migrations
    - api_breaking_changes
    - force_operations

visibility_contract:
  at_mentions: [Dante]
  tab_selector: [Web Development]
  default_agent: Web Development
  hidden_from_user: [Sergio, Elena, Uriel, Diego, Rosa, Víctor, Nora]
