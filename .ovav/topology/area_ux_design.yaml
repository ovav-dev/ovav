# UI/UX Design — Topology Contract
# Área de servicio profesional OVAV
# Este archivo define la jerarquía, delegación y reglas de visibilidad.

area:
  name: UI/UX Design
  id: area_ux_design
  description: "◆ Área de servicio · Design System · UX Research · Accessibility · Prototyping"
  scope:
    - design_system
    - ux_research
    - accessibility_wcag
    - prototyping
    - visual_design
    - interaction_design
    - user_testing
    - design_review
    - design_tokens
    - component_library

lead:
  role_id: ux_design_lead
  name: Elena
  canonical: .ovav/source/agents/leads/elena.md
  agent_file: lead-elena.md
  mode: subagent
  visible_in_at: true
  description: "✦ UI/UX Design Lead · Design System · UX Research · Accessibility · Prototyping"
  voice: primary_user_facing
  tone: creative_precise_user_centered

squads:
  - name: Design System
    canonical: .ovav/source/agents/teams/ux-design/design-system.md
    agent_file: team-design-system.md
    role: design_system_lead
    description: "Component library, design tokens, visual consistency"
    can_delegate_to: []

  - name: UX Research
    canonical: .ovav/source/agents/teams/ux-design/ux-research.md
    agent_file: team-ux-research.md
    role: ux_researcher
    description: "User testing, interviews, personas, journey maps"
    can_delegate_to: []

  - name: Accessibility
    canonical: .ovav/source/agents/teams/ux-design/accessibility.md
    agent_file: team-accessibility.md
    role: accessibility_specialist
    description: "WCAG 2.1 AA compliance, screen reader testing, contrast"
    can_delegate_to: []

  - name: Prototyping
    canonical: .ovav/source/agents/teams/ux-design/prototyping.md
    agent_file: team-prototyping.md
    role: prototyping_specialist
    description: "Interactive prototypes, Figma, design-to-code handoff"
    can_delegate_to: []

delegation_rules:
  max_depth: 1
  cross_squad: false
  require_lead_approval_for:
    - design_system_changes
    - public_visual_assets
    - accessibility_waivers
    - design_review_signoff

visibility_contract:
  at_mentions: [Elena]
  tab_selector: [UI/UX Design]
  default_agent: UI/UX Design
  hidden_from_user: []
