# DevOps & Infrastructure — Topology Contract
# Área de servicio profesional OVAV
# Este archivo define la jerarquía, delegación y reglas de visibilidad.

area:
  name: DevOps & Infrastructure
  id: area_devops_infrastructure
  description: "◆ Área de servicio · CI/CD · Cloud · SRE · Monitoreo"
  scope:
    - ci_cd_pipelines
    - cloud_infrastructure
    - infrastructure_as_code
    - monitoring_alerting
    - site_reliability_engineering
    - infrastructure_security
    - secret_management
    - deploy_rollback
    - incident_response
    - cost_optimization

lead:
  role_id: devops_infrastructure_lead
  name: Uriel
  canonical: .ovav/source/agents/leads/uriel.md
  agent_file: lead-uriel.md
  mode: subagent
  visible_in_at: true
  description: "✦ DevOps & Infrastructure Lead · CI/CD · Cloud · SRE · Monitoreo"
  voice: primary_user_facing
  tone: precise_operational_safety_first

squads:
  - name: CI/CD
    canonical: .ovav/source/agents/teams/devops-infrastructure/ci-cd.md
    agent_file: team-ci-cd.md
    role: ci_cd_engineer
    description: "CI/CD pipelines, GitHub Actions, build automation"
    can_delegate_to: []

  - name: Cloud
    canonical: .ovav/source/agents/teams/devops-infrastructure/cloud.md
    agent_file: team-cloud.md
    role: cloud_engineer
    description: "Cloud infrastructure, networking, cost optimization"
    can_delegate_to: []

  - name: Monitoring
    canonical: .ovav/source/agents/teams/devops-infrastructure/monitoring.md
    agent_file: team-monitoring.md
    role: monitoring_engineer
    description: "Monitoring, alerting, dashboards, log aggregation"
    can_delegate_to: []

  - name: SRE
    canonical: .ovav/source/agents/teams/devops-infrastructure/sre.md
    agent_file: team-sre.md
    role: sre_engineer
    description: "Reliability, SLAs, incident response, post-mortems"
    can_delegate_to: []

  - name: InfraSec
    canonical: .ovav/source/agents/teams/devops-infrastructure/infra-security.md
    agent_file: team-infra-security.md
    role: infra_security_engineer
    description: "Infrastructure hardening, secret management, compliance"
    can_delegate_to: []

delegation_rules:
  max_depth: 1
  cross_squad: false
  require_lead_approval_for:
    - production_deploy
    - secret_rotation
    - infrastructure_changes
    - incident_response

visibility_contract:
  at_mentions: [Uriel]
  tab_selector: [DevOps & Infrastructure]
  default_agent: DevOps & Infrastructure
  hidden_from_user: []
