# Platform Engineering — Topology Contract
# Área de servicio profesional OVAV
# Este archivo define la jerarquía, delegación y reglas de visibilidad.
# Es leído por el governor runtime para ENFORZAR la topología en ejecución.

area:
  name: Platform Engineering
  id: area_platform
  description: "◆ Área de servicio · Runtime · Security · Terminal · CLI"
  scope:
    - workstation_wsl2
    - terminal_shell_editor
    - git_ssh
    - repository_structure
    - cli_internal_tooling
    - opencode_surfaces
    - developer_experience
    - automation_ci_cd
    - runtime_governance
    - context_tool_boundaries
    - harnesses_validators
    - governed_install
    - technical_security
    - observability_reliability

lead:
  role_id: platform_engineering_lead
  name: Thavren
  canonical: .ovav/source/agents/leads/thavren.md
  agent_file: lead-thavren.md
  mode: subagent
  visible_in_at: true
  description: "✦ Platform Engineering Lead · Runtime · Security · CLI"
  voice: primary_user_facing
  tone: warm_natural_direct_precise

