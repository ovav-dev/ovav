delegation_rules:
  max_depth: 3
  cross_squad: false
  require_lead_approval_for:
    - production_changes
    - global_config_writes
    - force_operations
    
visibility_contract:
  at_mentions: [Thavren]
  tab_selector: [Platform Engineering]
  default_agent: Platform Engineering
  hidden_from_user: [Marco, Andrés, Lucas, Helena, Irene, Diana, Pablo, Óscar, Nora, Nadia, Mía, Clara]
