# OVAV workstation toolchain — Mise configuration 2026
# Source of truth for runtime versions used in OVAV development.
# Mise resolves tool versions from this file; starship reads it for the [mise] module.

[env]
# Identifier for OVAV workstation so other tools can detect this mise config.
OVAV_TOOLCHAIN_SOURCE = "mise-toml"

# ─────────────────────────────────────────────────────────────
#  Tool versions — active runtime contracts.
#  Add tools here as the OVAV project adopts them. Each entry makes
#  the tool available via mise-managed PATH and feeds starship's
#  [mise] module so the prompt icon ⬢ displays the active version.
# ─────────────────────────────────────────────────────────────

# Note: tools that aren't managed by mise are loaded from the host OS.
# When the project needs a pinned version, add e.g. python = "3.14".