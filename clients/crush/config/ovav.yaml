# OVAV Crush Configuration
# =============================================================================
# Isolated configuration for Crush harness - does NOT affect other harnesses
# Generated by: OVAV product install --harness crush
# Version: 1.0.0
# =============================================================================

# ── Identity ─────────────────────────────────────────────────────────────

harness:
  id: "crush"
  name: "OVAV on Crush"
  version: "1.0.0"
  isolated: true  # This config does not leak to other harnesses

# ── Provider Configuration ────────────────────────────────────────────────────
# Priority: MINIMAX_API_KEY > OVAV_* env vars > default

provider:
  default: "minimax"  # Use MiniMax as default for OVAV
  
  minimax:
    env_var: "MINIMAX_API_KEY"
    base_url: "https://api.minimaxi.chat/v1"
    model: "MiniMax-Text-01"
    color: "#FF6B35"
    auth_header: "Bearer"
    direct_api_key_env: "ANTHROPIC_API_KEY"
    direct_api_endpoint_env: "ANTHROPIC_API_ENDPOINT"
    direct_endpoint: "https://api.minimax.io/anthropic/v1"
    direct_provider: "minimax"
    direct_model: "minimax/MiniMax-M2.7"

  # Direct MiniMax subscription (uses YOUR subscription, NOT hypercredits)
  minimax_direct:
    provider: "minimax"
    model: "minimax/MiniMax-M2.7"
    api_key_env: "ANTHROPIC_API_KEY"
    api_endpoint_env: "ANTHROPIC_API_ENDPOINT"
    api_endpoint: "https://api.minimax.io/anthropic/v1"
    uses_hypercredits: false  # IMPORTANT: Uses your MiniMax subscription directly
  
  # Fallback providers (in order of priority)
  fallbacks:
    - provider: "aihubmix"
      model: "aihubmix/coding-minimax-m3"
      color: "#FF8C42"
    
    - provider: "hyper"
      model: "deepseek-v4-flash"
      color: "#7B68EE"

# ── OVAV System Integration ─────────────────────────────────────────────────

ovav:
  root: ".ovav"
  plan: ".ovav/plan/caps.yaml"
  agents_dir: "clients/crush/agents"
  
  # OVAV bins - absolute paths
  bins:
    ovav: "go-runtime/cmd/ovav"
    session_greeting: "go-runtime/cmd/session_greeting"
    output_guard: "go-runtime/cmd/output_guard"
    convert_agents: "go-runtime/cmd/convert_agents"
    connect: "go-runtime/cmd/connect"
    memory: "go-runtime/cmd/memory"
  
  # Validators (Python → Go migration path)
  validators:
    priority:
      - "check_living_integrity"
      - "contract_freshness"
      - "protected_branch"
      - "workspace_safety_gate"
      - "output_guard"
      - "ledger_write_path"
    python_fallback: "tools/validators"

# ── Crush Harness Rules ────────────────────────────────────────────────────

harness_rules:
  # OVAV delegation - use agent tool only
  delegation:
    tool: "agent"
    pattern: "agent(prompt: \"<task>\")"
    prohibited:
      - "workflow(\"ovav-delegate\","
      - "actor spawn"
  
  # Git discipline
  git:
    no_add_all: true
    no_raw_push: true
    protected_branches:
      - "main"
      - "master"
      - "develop"
      - "production"
      - "staging"
    workflow_command: "owd"  # Use owd to merge and cleanup
  
  # Response format
  response:
    language: "es"  # Spanish by default
    max_words: 150
    format: "compact"
    icons: true
    tables: true
    result_first: true

# ── Security Gates ──────────────────────────────────────────────────────────

gates:
  pre_write:
    enabled: true
    command: "python3 tools/harnesses/workspace_safety_gate.py --mode mutate"
    blocker_on_fail: true
  
  pre_push:
    enabled: true
    command: "python3 tools/github/ovav_git_push_gate.py"
    blocker_on_fail: true
  
  protected_branch:
    enabled: true
    check: "go run -C go-runtime ./cmd/session_greeting --json"
    waiver_required: true
  
  output_guard:
    enabled: true
    sign_all: true
    verify: "go run -C go-runtime ./cmd/output_guard --verify"

# ── Model Context ───────────────────────────────────────────────────────────

context:
  session_greeting:
    enabled: true
    command: "go run -C go-runtime ./cmd/session_greeting --json"
    parse_keys:
      - "greeting_text"
      - "context_summary"
      - "git_head"
      - "branch"
  
  caps_yaml:
    enabled: true
    path: ".ovav/plan/caps.yaml"
    fields:
      - "version"
      - "status"
      - "layer_status"
      - "product.version"
      - "governance.security_posture"

# ── Memory & Knowledge ──────────────────────────────────────────────────────

memory:
  index_dir: "clients/crush/memory"
  vector_enabled: false  # Requires ovav_memory
  
  # OVAV knowledge files to include in context
  include:
    - "OVAV_IDENTITY.md"
    - "AGENTS.md"
    - "crush_AGENTS.md"
    - ".ovav/plan/caps.yaml"

# ── Agent Projections ───────────────────────────────────────────────────────
# These get regenerated on `go run -C go-runtime ./cmd/convert_agents --target crush`

projections:
  crush:
    source: "go-runtime/internal/agents"
    output: "clients/crush/agents"
    levels: "all"  # areas + leads + teams
    format: "md"
  
  # Other harnesses (for reference - not managed by this config)
  other:
    - target: "opencode"
      output: ".opencode/agents"
    - target: "mimocode"
      output: "runtimes/mimocode/agents"
    - target: "claude"
      output: "clients/claude-code/agents"