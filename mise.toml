# OVAV Project — Pinned Toolchain
# Canonical tool versions for OVAV development.
# Any developer who clones this repo gets the same toolchain via `mise use`.
# Managed by: Platform Engineering (Thavren)
# Last updated: 2026-08-18 (P3 alignment to OVAV runtime truth)

# Sources of truth:
#   - go             : go-runtime/go.mod           → 1.26
#   - node           : package.json engines        → >=20.0.0 (LTS: 22)
#   - python         : pyproject.toml (root)       → >=3.12
#   - pnpm           : package.json packageManager → 9.0.0
#   - CI workflows   : .github/workflows/ci.yml   → go-version: 1.26

[env]
# Disable mise-managed auto-install in CI; explicit in dev
MISE_NODE_VERIFY = "1"

[tools]
# Go runtime — required by go-runtime/ (CAPA 9.5) — SOURCE: go.mod
go = "1.26"

# Node LTS — required by tools/cpanel/ (React/TypeScript)
# SOURCE: package.json engines >=20.0.0; pinned to 22 LTS "Jod"
node = "22.23.2"

# Python — required by pyproject.toml (root) ≥3.12 + web/backend ≥3.11
# Used by tools/ (validators), tests, and web backend
python = "3.12"

# pnpm — required by package.json packageManager field
# Installed via mise's pnpm backend (uses Corepack/npm)
pnpm = "9.0.0"

# ── Tasks (mise-native automation) ────────────────────────────────────────────
# Usage: mise run <task>

[tasks.go-build]
description = "Build OVAV CLI + cockpit TUI"
run = "cd go-runtime && make build-current && make build-cockpit"

[tasks.go-test]
description = "Run Go test suite"
run = "cd go-runtime && make test"

[tasks.go-install]
description = "Install ovav + cockpit to ~/.local/bin/"
run = "cd go-runtime && make install"

[tasks.validate]
description = "Run OVAV validators"
run = "ovav validate"

[tasks.status]
description = "OVAV status snapshot"
run = "ovav status"

[tasks.fmt]
description = "Format Go code with gofumpt"
run = "cd go-runtime && gofumpt -l -w ."

[tasks.lint]
description = "Run golangci-lint"
run = "cd go-runtime && golangci-lint run ./..."

[tasks.cpanel-dev]
description = "Start cpanel dev server"
run = "cd tools/cpanel && npm run dev"

[tasks.cpanel-install]
description = "Install cpanel dependencies"
run = "cd tools/cpanel && npm install"

[tasks.full-setup]
description = "Full dev environment bootstrap"
run = [
  "mise install",
  "cd go-runtime && make install",
  "go install mvdan.cc/gofumpt@latest",
]

# ── P3 additions ─────────────────────────────────────────────────────────────
# Parity validators — verify mise-installed tools match go.mod / package.json

[tasks.mise-parity]
description = "Verify mise-installed tools match OVAV runtime truth"
run = [
  "mise exec -- go version",
  "mise exec -- pnpm --version",
  "mise exec -- python --version",
  "mise exec -- node --version",
]

[tasks.mise-trust]
description = "Re-trust mise.toml after edits"
run = "mise trust"
